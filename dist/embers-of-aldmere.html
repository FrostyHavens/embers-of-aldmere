<style>

  body { display: flex; align-items: center; justify-content: center; }
  canvas#screen { image-rendering: pixelated; image-rendering: crisp-edges; display: block; }
</style>

<canvas id="screen"></canvas>

<script>/* src/core.js */
// ===== Core: canvas, loop, input, RNG, scenes =====
'use strict';
const G = window.G = {};
G.W = 320; G.H = 224;
G.TILE = 24;

// ---------- RNG (seedable, deterministic for tests) ----------
G.rngState = (Date.now() ^ 0x5bd1e995) >>> 0;
G.rand = function () { // xorshift32 -> [0,1)
  let x = G.rngState; x ^= x << 13; x >>>= 0; x ^= x >>> 17; x ^= x << 5; x >>>= 0;
  G.rngState = x; return x / 4294967296;
};
G.r = n => (n <= 0 ? 0 : Math.floor(G.rand() * n)); // 0..n-1
G.chance = n => G.r(n) === 0; // 1 in n
G.clamp = (v, a, b) => Math.max(a, Math.min(b, v));

// ---------- Canvas ----------
G.canvas = document.getElementById('screen');
G.ctx = G.canvas.getContext('2d');
G.canvas.width = G.W; G.canvas.height = G.H;
G.ctx.imageSmoothingEnabled = false;
G.makeCanvas = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; const x = c.getContext('2d'); x.imageSmoothingEnabled = false; return c; };
function resize() {
  const s = Math.max(1, Math.floor(Math.min(window.innerWidth / G.W, window.innerHeight / G.H) * 4) / 4);
  G.canvas.style.width = (G.W * s) + 'px'; G.canvas.style.height = (G.H * s) + 'px';
}
window.addEventListener('resize', resize); resize();

// ---------- Input ----------
// A = confirm/talk, B = cancel, C = menu/info, plus directions.
G.keys = {}; G.pressed = {}; G.repeatT = {};
const KEYMAP = {
  ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right',
  KeyW: 'up', KeyS: 'down', KeyA: 'left', KeyD: 'right',
  KeyZ: 'A', Space: 'A', Enter: 'A', KeyJ: 'A',
  KeyX: 'B', Escape: 'B', Backspace: 'B', KeyK: 'B',
  KeyC: 'C', ShiftLeft: 'C', ShiftRight: 'C', KeyL: 'C',
  KeyM: 'M'
};
window.addEventListener('keydown', e => {
  const k = KEYMAP[e.code]; if (!k) return;
  e.preventDefault();
  if (!G.keys[k]) { G.pressed[k] = true; G.repeatT[k] = 0; }
  G.keys[k] = true;
  G.audio && G.audio.unlock();
});
window.addEventListener('keyup', e => { const k = KEYMAP[e.code]; if (k) { G.keys[k] = false; } });
window.addEventListener('blur', () => { G.keys = {}; });
// touch/mouse -> unlock audio
window.addEventListener('pointerdown', () => G.audio && G.audio.unlock());

G.input = {
  // edge-triggered
  p(k) { return !!G.pressed[k]; },
  // held
  h(k) { return !!G.keys[k]; },
  // edge + auto-repeat (for cursors/menus)
  rep(k, delay = 14, rate = 5) {
    if (G.pressed[k]) return true;
    if (!G.keys[k]) return false;
    const t = G.repeatT[k] || 0;
    return t >= delay && (t - delay) % rate === 0;
  },
  dir() { // held direction (for walking)
    if (G.keys.up) return 'up'; if (G.keys.down) return 'down';
    if (G.keys.left) return 'left'; if (G.keys.right) return 'right'; return null;
  },
  repDir(delay, rate) {
    for (const d of ['up', 'down', 'left', 'right']) if (this.rep(d, delay, rate)) return d;
    return null;
  },
  clear() { G.pressed = {}; }
};
G.DIRS = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };

// ---------- Scene stack ----------
// A scene: {update(), draw(ctx), onEnter?, onExit?, transparent?}
G.scenes = [];
G.push = s => { G.scenes.push(s); s.onEnter && s.onEnter(); return s; };
G.pop = () => { const s = G.scenes.pop(); s && s.onExit && s.onExit(); return s; };
G.replace = s => { while (G.scenes.length) G.pop(); return G.push(s); };
G.top = () => G.scenes[G.scenes.length - 1];

// ---------- Coroutine-ish task runner (for cutscenes & battle flow) ----------
// Generators yield: number (wait frames), a Promise-like {done()} object, or nothing (1 frame)
G.Tasks = class {
  constructor() { this.list = []; }
  add(gen) { this.list.push({ gen, wait: 0, obj: null }); }
  get busy() { return this.list.length > 0; }
  update() {
    for (let i = this.list.length - 1; i >= 0; i--) {
      const t = this.list[i];
      if (t.wait > 0) { t.wait--; continue; }
      if (t.obj && !t.obj.done()) continue;
      const back = t.obj; t.obj = null;
      let r;
      try { r = t.gen.next(back); } catch (e) { console.error(e); this.list.splice(i, 1); continue; }
      if (r.done) { this.list.splice(i, 1); continue; }
      const v = r.value;
      if (typeof v === 'number') t.wait = v - 1;
      else if (v && typeof v.done === 'function') { t.obj = v; if (v.done()) { /* resolves next frame */ } }
    }
  }
};

// Fade overlay
G.fade = { a: 0, target: 0, speed: 0.08, color: '#000' };
G.fadeTo = (a, speed = 0.08, color = '#000') => { G.fade.target = a; G.fade.speed = speed; G.fade.color = color; return { done: () => G.fade.a === G.fade.target }; };

// Screen flash / shake
G.fx = { shake: 0, flash: 0, flashColor: '#fff' };

G.frame = 0;
function step() {
  G.frame++;
  const s = G.top();
  if (s) s.update();
  // fade
  const f = G.fade;
  if (f.a < f.target) f.a = Math.min(f.target, f.a + f.speed);
  else if (f.a > f.target) f.a = Math.max(f.target, f.a - f.speed);
  if (G.fx.shake > 0) G.fx.shake--;
  if (G.fx.flash > 0) G.fx.flash--;
  for (const k in G.keys) if (G.keys[k]) G.repeatT[k] = (G.repeatT[k] || 0) + 1;
  G.pressed = {};
  G.audio && G.audio.tick();
}
function draw() {
  const ctx = G.ctx;
  ctx.save();
  if (G.fx.shake > 0) ctx.translate(G.r(5) - 2, G.r(3) - 1);
  ctx.fillStyle = '#000'; ctx.fillRect(-4, -4, G.W + 8, G.H + 8);
  // draw from lowest non-transparent scene upward
  let start = G.scenes.length - 1;
  while (start > 0 && G.scenes[start].transparent) start--;
  for (let i = Math.max(0, start); i < G.scenes.length; i++) G.scenes[i].draw(ctx);
  ctx.restore();
  if (G.fx.flash > 0) { ctx.globalAlpha = Math.min(1, G.fx.flash / 6); ctx.fillStyle = G.fx.flashColor; ctx.fillRect(0, 0, G.W, G.H); ctx.globalAlpha = 1; }
  if (G.fade.a > 0) { ctx.globalAlpha = G.fade.a; ctx.fillStyle = G.fade.color; ctx.fillRect(0, 0, G.W, G.H); ctx.globalAlpha = 1; }
}
G.step = step; G.drawFrame = draw;

let last = performance.now(), acc = 0;
G.speedMul = 1;
function loop(now) {
  acc += Math.min(100, now - last); last = now;
  const dt = 1000 / 60;
  let n = 0;
  while (acc >= dt && n < 5) { for (let k = 0; k < G.speedMul; k++) step(); acc -= dt; n++; }
  draw();
  requestAnimationFrame(loop);
}
G.start = () => { if (location.hash === '#test') return; requestAnimationFrame(t => { last = t; loop(t); }); };

// ---------- Storage (safe) ----------
G.store = {
  get(k) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : null; } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } },
  del(k) { try { localStorage.removeItem(k); } catch (e) { } }
};

// ---------- Touch controls (phones/tablets) ----------
(function () {
  const touch = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0 && matchMedia('(pointer: coarse)').matches);
  G.canvas.tabIndex = 0;
  G.canvas.addEventListener('pointerdown', () => { try { G.canvas.focus(); } catch (e) { } });
  if (!touch) return;
  const css = document.createElement('style');
  css.textContent = '.tc{position:fixed;z-index:5;display:flex;gap:10px;touch-action:none;user-select:none;-webkit-user-select:none}' +
    '.tc button{width:54px;height:54px;border-radius:50%;border:2px solid #8898e0;background:rgba(28,44,140,.55);color:#f0f0ff;font:bold 16px monospace}' +
    '.tc button:active,.tc button.on{background:rgba(240,208,96,.7);color:#101030}' +
    '#tcpad{left:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:repeat(3,48px);grid-template-rows:repeat(3,48px);gap:2px}' +
    '#tcpad button{width:48px;height:48px;border-radius:8px}' +
    '#tcbtn{right:14px;bottom:calc(20px + env(safe-area-inset-bottom,0px));align-items:flex-end}';
  document.head.appendChild(css);
  const pad = document.createElement('div'); pad.id = 'tcpad'; pad.className = 'tc';
  const cells = ['', 'up', '', 'left', '', 'right', '', 'down', ''];
  const lab = { up: '▲', down: '▼', left: '◀', right: '▶' };
  cells.forEach(k => { const b = document.createElement(k ? 'button' : 'span'); if (k) { b.textContent = lab[k]; b.dataset.k = k; } pad.appendChild(b); });
  const btns = document.createElement('div'); btns.id = 'tcbtn'; btns.className = 'tc';
  [['C', 'C'], ['B', 'B'], ['A', 'A']].forEach(([k, t]) => { const b = document.createElement('button'); b.textContent = t; b.dataset.k = k; if (k === 'A') b.style.marginBottom = '30px'; btns.appendChild(b); });
  document.body.appendChild(pad); document.body.appendChild(btns);
  const down = k => { if (!G.keys[k]) { G.pressed[k] = true; G.repeatT[k] = 0; } G.keys[k] = true; G.audio && G.audio.unlock(); };
  const up = k => { G.keys[k] = false; };
  [pad, btns].forEach(el => {
    el.addEventListener('pointerdown', e => { const k = e.target.dataset && e.target.dataset.k; if (!k) return; e.preventDefault(); e.target.classList.add('on'); down(k); e.target.setPointerCapture && e.target.setPointerCapture(e.pointerId); });
    const rel = e => { const k = e.target.dataset && e.target.dataset.k; if (!k) return; e.target.classList.remove('on'); up(k); };
    el.addEventListener('pointerup', rel); el.addEventListener('pointercancel', rel); el.addEventListener('pointerleave', rel);
  });
})();

</script>
<script>/* src/gfx.js */
// ===== Graphics helpers: bitmap font, windows, sprite compiler =====
'use strict';
(function () {
  // ---- 5x7 (+descender) bitmap font; proportional widths computed from bits ----
  const F = {
    'A': [14, 17, 17, 17, 31, 17, 17], 'B': [30, 17, 17, 30, 17, 17, 30], 'C': [14, 17, 16, 16, 16, 17, 14], 'D': [28, 18, 17, 17, 17, 18, 28],
    'E': [31, 16, 16, 30, 16, 16, 31], 'F': [31, 16, 16, 30, 16, 16, 16], 'G': [14, 17, 16, 23, 17, 17, 15], 'H': [17, 17, 17, 31, 17, 17, 17],
    'I': [14, 4, 4, 4, 4, 4, 14], 'J': [7, 2, 2, 2, 2, 18, 12], 'K': [17, 18, 20, 24, 20, 18, 17], 'L': [16, 16, 16, 16, 16, 16, 31],
    'M': [17, 27, 21, 21, 17, 17, 17], 'N': [17, 17, 25, 21, 19, 17, 17], 'O': [14, 17, 17, 17, 17, 17, 14], 'P': [30, 17, 17, 30, 16, 16, 16],
    'Q': [14, 17, 17, 17, 21, 18, 13], 'R': [30, 17, 17, 30, 20, 18, 17], 'S': [15, 16, 16, 14, 1, 1, 30], 'T': [31, 4, 4, 4, 4, 4, 4],
    'U': [17, 17, 17, 17, 17, 17, 14], 'V': [17, 17, 17, 17, 17, 10, 4], 'W': [17, 17, 17, 21, 21, 21, 10], 'X': [17, 17, 10, 4, 10, 17, 17],
    'Y': [17, 17, 17, 10, 4, 4, 4], 'Z': [31, 1, 2, 4, 8, 16, 31],
    'a': [0, 0, 14, 1, 15, 17, 15], 'b': [16, 16, 22, 25, 17, 17, 30], 'c': [0, 0, 14, 16, 16, 17, 14], 'd': [1, 1, 13, 19, 17, 17, 15],
    'e': [0, 0, 14, 17, 31, 16, 14], 'f': [6, 9, 8, 28, 8, 8, 8], 'g': [0, 0, 15, 17, 17, 15, 1, 14], 'h': [16, 16, 22, 25, 17, 17, 17],
    'i': [4, 0, 12, 4, 4, 4, 14], 'j': [2, 0, 6, 2, 2, 2, 18, 12], 'k': [16, 16, 18, 20, 24, 20, 18], 'l': [12, 4, 4, 4, 4, 4, 14],
    'm': [0, 0, 26, 21, 21, 17, 17], 'n': [0, 0, 22, 25, 17, 17, 17], 'o': [0, 0, 14, 17, 17, 17, 14], 'p': [0, 0, 30, 17, 17, 30, 16, 16],
    'q': [0, 0, 15, 17, 17, 15, 1, 1], 'r': [0, 0, 22, 25, 16, 16, 16], 's': [0, 0, 15, 16, 14, 1, 30], 't': [8, 8, 28, 8, 8, 9, 6],
    'u': [0, 0, 17, 17, 17, 19, 13], 'v': [0, 0, 17, 17, 17, 10, 4], 'w': [0, 0, 17, 17, 21, 21, 10], 'x': [0, 0, 17, 10, 4, 10, 17],
    'y': [0, 0, 17, 17, 17, 15, 1, 14], 'z': [0, 0, 31, 2, 4, 8, 31],
    '0': [14, 17, 19, 21, 25, 17, 14], '1': [4, 12, 4, 4, 4, 4, 14], '2': [14, 17, 1, 2, 4, 8, 31], '3': [31, 2, 4, 2, 1, 17, 14],
    '4': [2, 6, 10, 18, 31, 2, 2], '5': [31, 16, 30, 1, 1, 17, 14], '6': [6, 8, 16, 30, 17, 17, 14], '7': [31, 1, 2, 4, 8, 8, 8],
    '8': [14, 17, 17, 14, 17, 17, 14], '9': [14, 17, 17, 15, 1, 2, 12],
    '!': [4, 4, 4, 4, 4, 0, 4], '?': [14, 17, 1, 2, 4, 0, 4], '.': [0, 0, 0, 0, 0, 12, 12], ',': [0, 0, 0, 0, 12, 4, 8],
    "'": [12, 4, 8, 0, 0, 0, 0], '"': [10, 10, 0, 0, 0, 0, 0], '-': [0, 0, 0, 14, 0, 0, 0], '+': [0, 4, 4, 31, 4, 4, 0],
    '/': [0, 1, 2, 4, 8, 16, 0], ':': [0, 12, 12, 0, 12, 12, 0], ';': [0, 12, 12, 0, 12, 4, 8], '%': [24, 25, 2, 4, 8, 19, 3],
    '(': [2, 4, 8, 8, 8, 4, 2], ')': [8, 4, 2, 2, 2, 4, 8], '=': [0, 0, 31, 0, 31, 0, 0], '*': [0, 4, 21, 14, 21, 4, 0],
    '#': [10, 10, 31, 10, 31, 10, 10], '&': [12, 18, 20, 8, 21, 18, 13], '<': [2, 4, 8, 16, 8, 4, 2], '>': [8, 4, 2, 1, 2, 4, 8],
    '[': [14, 8, 8, 8, 8, 8, 14], ']': [14, 2, 2, 2, 2, 2, 14], '_': [0, 0, 0, 0, 0, 0, 31], '~': [0, 0, 8, 21, 2, 0, 0],
    // icons (private chars)
    '\u0001': [0, 31, 31, 14, 4, 0, 0],       // down triangle (more text)
    '\u0002': [16, 24, 28, 30, 28, 24, 16],  // right cursor
    '\u0003': [0, 10, 31, 31, 14, 4, 0],     // heart
    '\u0004': [4, 14, 31, 14, 4, 0, 0],      // gem/gold
  };
  const glyphs = {};
  for (const ch in F) {
    const rows = F[ch];
    let minc = 5, maxc = -1;
    rows.forEach(r => { for (let c = 0; c < 5; c++) if (r & (1 << (4 - c))) { minc = Math.min(minc, c); maxc = Math.max(maxc, c); } });
    if (maxc < 0) { minc = 0; maxc = 2; }
    // keep uppercase & digits monospaced-ish for tidy numbers
    if (/[0-9]/.test(ch)) { minc = 0; maxc = 4; }
    glyphs[ch] = { rows, x0: minc, w: maxc - minc + 1 };
  }
  glyphs[' '] = { rows: [], x0: 0, w: 3 };
  const cache = {};
  function glyphCanvas(ch, color) {
    const key = ch + color;
    if (cache[key]) return cache[key];
    const g = glyphs[ch] || glyphs['?'];
    const c = G.makeCanvas(g.w, 8); const x = c.getContext('2d'); x.fillStyle = color;
    g.rows.forEach((r, y) => { for (let col = 0; col < g.w; col++) if (r & (1 << (4 - (col + g.x0)))) x.fillRect(col, y, 1, 1); });
    cache[key] = c; return c;
  }
  G.textWidth = function (s) { let w = 0; for (const ch of String(s)) { const g = glyphs[ch] || glyphs['?']; w += g.w + 1; } return Math.max(0, w - 1); };
  // draw text with 1px drop shadow (SF-style legibility)
  G.text = function (ctx, s, x, y, color = '#fff', shadow = '#10102a') {
    s = String(s); x = Math.round(x); y = Math.round(y);
    let cx = x;
    for (const ch of s) {
      const g = glyphs[ch] || glyphs['?'];
      if (ch !== ' ') {
        if (shadow) ctx.drawImage(glyphCanvas(ch, shadow), cx + 1, y + 1);
        ctx.drawImage(glyphCanvas(ch, color), cx, y);
      }
      cx += g.w + 1;
    }
    return cx - x;
  };
  G.textR = (ctx, s, xr, y, c, sh) => G.text(ctx, s, xr - G.textWidth(s), y, c, sh);
  G.textC = (ctx, s, xc, y, c, sh) => G.text(ctx, s, xc - Math.floor(G.textWidth(s) / 2), y, c, sh);
  // word-wrap into lines that fit width
  G.wrap = function (s, maxW) {
    const out = [];
    String(s).split('\n').forEach(par => {
      const words = par.split(' '); let line = '';
      words.forEach(w => {
        const t = line ? line + ' ' + w : w;
        if (G.textWidth(t) > maxW && line) { out.push(line); line = w; } else line = t;
      });
      out.push(line);
    });
    return out;
  };

  // ---- Windows (deep blue, beveled light frame) ----
  const WIN = { fill1: '#1c2c8c', fill2: '#0c1450', edge: '#f0f0ff', edge2: '#8898e0', dark: '#000010' };
  G.win = function (ctx, x, y, w, h, opts = {}) {
    x = Math.round(x); y = Math.round(y); w = Math.round(w); h = Math.round(h);
    const grd = ctx.createLinearGradient(0, y, 0, y + h);
    grd.addColorStop(0, opts.fill1 || WIN.fill1); grd.addColorStop(1, opts.fill2 || WIN.fill2);
    ctx.globalAlpha = opts.alpha == null ? 0.94 : opts.alpha;
    ctx.fillStyle = grd; ctx.fillRect(x + 2, y + 2, w - 4, h - 4);
    ctx.globalAlpha = 1;

    ctx.fillStyle = WIN.dark;
    ctx.fillRect(x + 2, y, w - 4, 1); ctx.fillRect(x + 2, y + h - 1, w - 4, 1); ctx.fillRect(x, y + 2, 1, h - 4); ctx.fillRect(x + w - 1, y + 2, 1, h - 4);
    ctx.fillRect(x + 1, y + 1, 1, 1); ctx.fillRect(x + w - 2, y + 1, 1, 1); ctx.fillRect(x + 1, y + h - 2, 1, 1); ctx.fillRect(x + w - 2, y + h - 2, 1, 1);
    // light bevel
    ctx.fillStyle = WIN.edge;
    ctx.fillRect(x + 2, y + 1, w - 4, 1); ctx.fillRect(x + 1, y + 2, 1, h - 4); ctx.fillRect(x + 2, y + h - 2, w - 4, 1); ctx.fillRect(x + w - 2, y + 2, 1, h - 4);
    ctx.fillStyle = WIN.edge2;
    ctx.fillRect(x + 3, y + 2, w - 6, 1); ctx.fillRect(x + 2, y + 3, 1, h - 6); ctx.fillRect(x + 3, y + h - 3, w - 6, 1); ctx.fillRect(x + w - 3, y + 3, 1, h - 6);
  };
  G.bar = function (ctx, x, y, w, v, max, color = '#f8d030') {
    ctx.fillStyle = '#000'; ctx.fillRect(x, y, w + 2, 5);
    ctx.fillStyle = '#403858'; ctx.fillRect(x + 1, y + 1, w, 3);
    const f = max > 0 ? Math.round(w * G.clamp(v / max, 0, 1)) : 0;
    ctx.fillStyle = color; ctx.fillRect(x + 1, y + 1, f, 3);

  };

  // ---- Sprite compiler: string rows + palette -> canvas (cached) ----
  const sprCache = {};
  G.sprite = function (key, rows, pal, flip = false) {
    const k = key + (flip ? '|f' : '');
    if (sprCache[k]) return sprCache[k];
    const h = rows.length, w = Math.max(...rows.map(r => r.length));
    const c = G.makeCanvas(w, h), x = c.getContext('2d');
    const img = x.createImageData(w, h);
    for (let yy = 0; yy < h; yy++) for (let xx = 0; xx < w; xx++) {
      const ch = rows[yy][flip ? w - 1 - xx : xx];
      if (!ch || ch === '.' || ch === ' ') continue;
      const col = pal[ch]; if (!col) continue;
      const n = parseInt(col.slice(1), 16);
      const i = (yy * w + xx) * 4;
      if (col.length === 4) { // #rgb
        img.data[i] = ((n >> 8) & 15) * 17; img.data[i + 1] = ((n >> 4) & 15) * 17; img.data[i + 2] = (n & 15) * 17;
      } else { img.data[i] = (n >> 16) & 255; img.data[i + 1] = (n >> 8) & 255; img.data[i + 2] = n & 255; }
      img.data[i + 3] = 255;
    }
    x.putImageData(img, 0, 0);
    sprCache[k] = c; return c;
  };
  G.cached = function (key, w, h, fn) { // generic cached procedural canvas
    if (sprCache[key]) return sprCache[key];
    const c = G.makeCanvas(w, h); fn(c.getContext('2d'), c); sprCache[key] = c; return c;
  };
  // silhouette tint (for flashing hit, white-out etc.)
  G.tinted = function (src, color, key) {
    const k = 'tint|' + key + '|' + color;
    if (sprCache[k]) return sprCache[k];
    const c = G.makeCanvas(src.width, src.height), x = c.getContext('2d');
    x.drawImage(src, 0, 0); x.globalCompositeOperation = 'source-in'; x.fillStyle = color; x.fillRect(0, 0, c.width, c.height);
    sprCache[k] = c; return c;
  };
  // colour utils

// ===== Music: original compositions for "Embers of Aldmere" =====
// All melodies, basslines and progressions here are original. Lead lines are

      const m = /^([nx]):?(\d+)(\.?)$/.exec(t); if (!m) throw new Error('bad rhythm ' + t);
      return { play: m[1] === 'n', b: lenBeats(+m[2], !!m[3]) };
    }) : null;

    let prev = null;
    for (const seg of segs) {
      const ch = seg.ch;
      const pcs = ch.iv.map(i => (ch.root + i) % 12);
      const req = [];
      if (ch.iv[1] === 3 || ch.iv[1] === 4) req.push(pcs[1]);
      if (n >= 3 && pcs.length >= 4) req.push(pcs[3]);
      const cand = [];
      for (let m = center - 9; m <= center + 9; m++) if (pcs.includes(m % 12)) cand.push(m);
      let best = null, bestCost = Infinity;
      const pick = (start, acc) => {
        if (acc.length === n) {
          const pset = acc.map(m => m % 12);
          if (new Set(pset).size < n) return;
          if (!req.every(p => pset.includes(p))) return;
          if (acc[n - 1] - acc[0] > 12) return;
          let cost = 0;
          for (let i = 0; i < n; i++) cost += prev ? Math.abs(acc[i] - prev[i]) : Math.abs(acc[i] - center);
          for (let i = 1; i < n; i++) if (acc[i] - acc[i - 1] <= 2) cost += 3;
          const mean = acc.reduce((a, b) => a + b, 0) / n; cost += 0.3 * Math.abs(mean - center);
          if (cost < bestCost) { bestCost = cost; best = acc.slice(); }
          return;
        }
        for (let i = start; i < cand.length; i++) { acc.push(cand[i]); pick(i + 1, acc); acc.pop(); }
      };
      pick(0, []);
      if (!best) throw new Error('no voicing');
      for (let v = 0; v < n; v++) {
        if (!rt) { outs[v] += note(best[v], seg.beats); continue; }
        let t = 0, k = 0;
        while (t < seg.beats - 1e-6) {
          const tk = rt[k++ % rt.length]; const d = Math.min(tk.b, seg.beats - t);
          outs[v] += tk.play ? note(best[v], d) : rest(d); t += d;
        }
      }
      prev = best;
    }

  }

<script>/* src/ui.js */
// ===== UI: dialogue boxes, list menus, 4-way icon menus, number/confirm prompts =====
'use strict';
(function () {
  // Awaitable handle returned by UI calls; generators can `yield` it.
  class Wait { constructor() { this.fin = false; this.result = undefined; } done() { return this.fin; } resolve(v) { this.result = v; this.fin = true; } }
  G.Wait = Wait;

  // ---------- Dialogue ----------
  // G.say(text | [texts], {name, portrait, pos:'bottom'|'top', auto}) -> Wait
  class TextBox {
    constructor(pages, opts, w) {
      this.transparent = true; this.opts = opts || {}; this.w = w;
      this.pages = (Array.isArray(pages) ? pages : [pages]).map(p => String(p));
      this.pi = 0; this.setPage();
    }
    setPage() {
      const hasP = !!this.opts.portrait;
      this.boxX = hasP ? 70 : 8; this.boxW = G.W - this.boxX - 8;
      this.lines = G.wrap(this.pages[this.pi], this.boxW - 18);
      this.shown = 0; this.total = this.lines.join('').length; this.scroll = 0; this.t = 0;
    }
    update() {
      this.t++;
      const maxLines = 3;
      const visibleChars = this.lines.slice(this.scroll, this.scroll + maxLines).join('').length;
      const prevChars = this.lines.slice(0, this.scroll).join('').length;
      const target = prevChars + visibleChars;
      if (this.shown < target) {
        const sp = G.input.h('A') || G.input.h('B') ? 4 : 1;
        for (let k = 0; k < sp && this.shown < target; k++) { this.shown++; }
        if (this.t % 3 === 0 && !this.opts.silent) G.audio.sfx('text');
        if ((G.input.p('A') || G.input.p('B')) && this.t > 4) this.shown = target;
        return;
      }
      if (this.opts.auto) { if (this.t > this.opts.auto) this.next(); return; }
      if (G.input.p('A') || G.input.p('B') || G.input.p('C')) this.next();
    }
    next() {
      if (this.scroll + 3 < this.lines.length) { this.scroll += 3; this.t = 0; return; }
      this.pi++;
      if (this.pi >= this.pages.length) { G.pop(); this.w.resolve(); return; }
      this.setPage();
    }
    draw(ctx) {
      const top = this.opts.pos === 'top';
      const h = 50, y = top ? 6 : G.H - h - 6;
      if (this.opts.portrait) {
        const py = top ? 6 : G.H - 60 - 6;
        G.win(ctx, 6, py, 60, 60);
        G.drawPortrait(ctx, this.opts.portrait, 10, py + 4, this.t);
      }
      G.win(ctx, this.boxX, y, this.boxW, h);
      let chars = this.shown - this.lines.slice(0, this.scroll).join('').length;
      for (let i = 0; i < 3; i++) {
        const ln = this.lines[this.scroll + i]; if (ln === undefined) break;
        const part = ln.slice(0, Math.max(0, chars)); chars -= ln.length;
        G.text(ctx, part, this.boxX + 9, y + 9 + i * 12);
      }
      const done = this.shown >= this.lines.slice(0, this.scroll + 3).join('').length;
      if (done && !this.opts.auto && (this.t >> 4) % 2 === 0) G.text(ctx, '\u0001', this.boxX + this.boxW - 14, y + h - 12, '#f8e060');
    }
  }
  G.say = function (pages, opts) { const w = new Wait(); G.push(new TextBox(pages, opts, w)); return w; };

  // ---------- List menu ----------
  // items: [{label, right?, disabled?, color?}] or strings. opts: {x,y,w,title,cols,onMove(i),maxRows,cancel:true,help(i)->str}
  class ListMenu {
    constructor(items, opts, w) {
      this.transparent = true; this.w = w; this.opts = opts || {};
      this.items = items.map(it => typeof it === 'string' ? { label: it } : it);
      this.i = G.clamp(this.opts.start || 0, 0, Math.max(0, this.items.length - 1)); this.top = 0; this.t = 0;
      this.rows = Math.min(this.items.length, this.opts.maxRows || 8);
      const iw = Math.max(...this.items.map(it => G.textWidth(it.label) + (it.right ? G.textWidth(it.right) + 14 : 0)), this.opts.title ? G.textWidth(this.opts.title) : 0);
      this.wd = this.opts.w || iw + 30;
      this.ht = this.rows * 12 + 14 + (this.opts.title ? 12 : 0);
      this.x = this.opts.x != null ? this.opts.x : Math.floor((G.W - this.wd) / 2);
      this.y = this.opts.y != null ? this.opts.y : Math.floor((G.H - this.ht) / 2);
      this.opts.onMove && this.opts.onMove(this.i);
    }
    update() {
      this.t++;
      const n = this.items.length; if (!n) { if (G.input.p('B') || G.input.p('A')) { G.pop(); this.w.resolve(-1); } return; }
      const d = G.input.repDir(14, 4);
      if (d === 'up' || d === 'down') {
        this.i = (this.i + (d === 'up' ? -1 : 1) + n) % n; G.audio.sfx('cursor');
        this.opts.onMove && this.opts.onMove(this.i);
      }
      if (this.i < this.top) this.top = this.i; if (this.i >= this.top + this.rows) this.top = this.i - this.rows + 1;
      if (G.input.p('A')) {
        const it = this.items[this.i];
        if (it.disabled) { G.audio.sfx('error'); return; }
        G.audio.sfx('ok'); if (!this.opts.keep) G.pop(); this.w.resolve(this.i);
      } else if (G.input.p('B') && this.opts.cancel !== false) { G.audio.sfx('cancel'); G.pop(); this.w.resolve(-1); }
    }
    draw(ctx) {
      G.win(ctx, this.x, this.y, this.wd, this.ht);
      let y = this.y + 8;
      if (this.opts.title) { G.text(ctx, this.opts.title, this.x + 9, y, '#f8e060'); y += 12; }
      for (let r = 0; r < this.rows; r++) {
        const idx = this.top + r, it = this.items[idx]; if (!it) break;
        const col = it.disabled ? '#7078a0' : (it.color || '#fff');
        G.text(ctx, it.label, this.x + 17, y + r * 12, col);
        if (it.right) G.textR(ctx, it.right, this.x + this.wd - 9, y + r * 12, col);
        if (idx === this.i && (this.t >> 3) % 4 !== 3) G.text(ctx, '\u0002', this.x + 8, y + r * 12, '#f8e060');
      }
      if (this.top > 0) G.textC(ctx, '^', this.x + this.wd / 2, this.y + 2, '#f8e060');
      if (this.top + this.rows < this.items.length) G.textC(ctx, '\u0001', this.x + this.wd / 2, this.y + this.ht - 8, '#f8e060');
      if (this.opts.help) {
        const hs = this.opts.help(this.i); if (hs) { const lines = G.wrap(hs, G.W - 34); const hh = lines.length * 11 + 12; G.win(ctx, 8, G.H - hh - 6, G.W - 16, hh); lines.forEach((l, k) => G.text(ctx, l, 17, G.H - hh + 1 + k * 11)); }
      }
    }
  }
  G.menu = function (items, opts) { const w = new Wait(); G.push(new ListMenu(items, opts, w)); return w; };

  // ---------- Yes/No ----------
  G.confirm = function (opts = {}) { return G.menu([{ label: 'Yes' }, { label: 'No' }], Object.assign({ x: G.W - 70, y: G.H - 110 }, opts)); };

  // ---------- 4-way icon menu (SF-style cross) ----------
  // entries: {up:{label, icon}, left:..., right:..., down:...}; returns 'up'/'left'/... or null
  class CrossMenu {
    constructor(entries, opts, w) { this.transparent = true; this.e = entries; this.opts = opts || {}; this.w = w; this.sel = 'up'; this.t = 0; }
    update() {
      this.t++;
      const d = G.input.repDir(20, 10);
      if (d && this.e[d]) { if (d !== this.sel) G.audio.sfx('cursor'); this.sel = d; }
      if (G.input.p('A')) {
        const en = this.e[this.sel];
        if (en.disabled) { G.audio.sfx('error'); return; }
        G.audio.sfx('ok'); G.pop(); this.w.resolve(this.sel);
      } else if (G.input.p('B')) { G.audio.sfx('cancel'); G.pop(); this.w.resolve(null); }
    }
    draw(ctx) {
      const cx = this.opts.x != null ? this.opts.x : G.W / 2, cy = this.opts.y != null ? this.opts.y : G.H - 52;
      const pos = { up: [0, -22], left: [-30, 0], right: [30, 0], down: [0, 22] };
      for (const d of ['up', 'left', 'right', 'down']) {
        const en = this.e[d]; if (!en) continue;
        const [dx, dy] = pos[d]; const s = d === this.sel;
        const bob = s ? Math.round(Math.sin(this.t / 5) * 1.5) : 0;
        G.drawIcon(ctx, en.icon, cx + dx - 12, cy + dy - 10 + bob, s, en.disabled);
      }
      const lab = this.e[this.sel].label;
      const lw = G.textWidth(lab) + 18;
      G.win(ctx, cx + 48, cy - 8, Math.max(56, lw), 20);
      G.text(ctx, lab, cx + 57, cy - 2, this.e[this.sel].disabled ? '#7078a0' : '#fff');
    }
  }
  G.cross = function (entries, opts) { const w = new Wait(); G.push(new CrossMenu(entries, opts, w)); return w; };

  // ---------- Icons (procedural 24x20 framed tiles) ----------
  const ICON_ART = {
    attack: ['.........ww', '........wWw', '.......wWw.', '......wWw..', '.....wWw...', '.y..wWw....', '.yyWWw.....', '..yyy......', '.bybyy.....', 'bb...y.....', 'b..........'],
    magic: ['....s.....', '...sSs....', '....s.....', '...ooo....', '...oOo....', '....b.....', '....b.....', '....b.....', '....b.....', '....b.....', '...bbb....'],
    item: ['...bbbb...', '..b....b..', '.rrrrrrrr.', 'rRRRRRRRRr', 'rRRyyRRRRr', 'rRRyyRRRRr', 'rRRRRRRRRr', 'rRRRRRRRRr', '.rrrrrrrr.'],
    stay: ['....hh....', '...hssh...', '...ssss...', '....ss....', '..bbbbbb..', '.bbbbbbbb.', '.s.bbbb.s.', '...bbbb...', '...b..b...', '...b..b...', '..bb..bb..'],
    member: ['...hhhh...', '..hhhhhh..', '..hssssh..', '..sesses..', '..ssssss..', '...smms...', '....ss....', '..bbbbbb..', '.bbbbbbbb.', 'bbbbbbbbbb'],
    search: ['..gggg....', '.gWWWWg...', 'gWwwwwWg..', 'gWwwwwWg..', 'gWwwwwWg..', '.gWWWWg...', '..ggggbb..', '......bbb.', '.......bbb', '........bb'],
    talk: ['.wwwwwwww.', 'wwwwwwwwww', 'ww.w.w.www', 'wwwwwwwwww', '.wwwwwwww.', '...ww.....', '..w.......'],
    give: ['..rr......', '.rRRr.....', '.rRRr.....', '..rr.ss...', '....sssss.', '...ssssss.', '...sssss..'],
    equip: ['.gg....gg.', 'gWWg..gWWg', 'gWWWggWWWg', '.gWWWWWWg.', '..gWWWWg..', '..gWWWWg..', '.gWWggWWg.', '.gWg..gWg.'],
    drop: ['....b.....', '....b.....', '....b.....', '..bbbbb...', '...bbb....', '....b.....', '..........', '.rrrrrrr..'],
    use: ['...gg.....', '..gggg....', '..gGGg....', '.gGGGGg...', '.gGGGGg...', '.gGGGGg...', '..gggg....'],
    depot: ['rrrrrrrrrr', 'rRRRRRRRRr', 'rryyyyyyrr', 'rRRRRRRRRr', 'rRRRRRRRRr', 'rrrrrrrrrr'],
    join: ['..h....h..', '.hsh..hsh.', '.sss..sss.', '..s....s..', '.bbb..ccc.', 'bbbbbcccccc', '.bb....cc.'],
    quit: ['w........w', '.w......w.', '..w....w..', '...w..w...', '....ww....', '...w..w...', '..w....w..', '.w......w.', 'w........w'],
  };
  const ICON_PAL = { w: '#e8e8f8', W: '#a8b0d0', y: '#e8b830', b: '#8a5a30', s: '#f0c8a0', S: '#fff8a0', o: '#58a8f8', O: '#b8e0ff', r: '#a83828', R: '#d86040', h: '#704018', e: '#202040', m: '#c05050', g: '#b0b8c8', G: '#50e080', c: '#3868c8' };
  G.drawIcon = function (ctx, name, x, y, sel, disabled) {
    const frame = G.cached('iconframe' + (sel ? 1 : 0) + (disabled ? 1 : 0), 24, 20, (c) => {

// ===== Tiles: terrain table, procedural neighbour-aware map tiles, battle backdrops =====
// All art here is original and generated in code (no external assets).
(function () {
  'use strict';
  const TS = G.TILE || 24;
  const TAU = Math.PI * 2;

  // =====================================================================
  //  Colour + pixel-buffer helpers
  // =====================================================================
  const cl = v => (v < 0 ? 0 : v > 255 ? 255 : v | 0);
  function rgbU(r, g, b) { return (0xff000000 | (b << 16) | (g << 8) | r) >>> 0; }
  function U(h) {
    let n = parseInt(h.slice(1), 16);
    if (h.length === 4) return rgbU(((n >> 8) & 15) * 17, ((n >> 4) & 15) * 17, (n & 15) * 17);

    const r = (a & 255) + ((b & 255) - (a & 255)) * t, g = ((a >>> 8) & 255) + (((b >>> 8) & 255) - ((a >>> 8) & 255)) * t,

    get(x, y) { x |= 0; y |= 0; if (x < 0 || y < 0 || x >= this.w || y >= this.h) return 0; return this.p[y * this.w + x]; }
    fill(c) { this.p.fill(c); }
    rect(x, y, w, h, c) { for (let j = y; j < y + h; j++) for (let i = x; i < x + w; i++) this.set(i, j, c); }
    hl(x0, x1, y, c) { for (let i = x0; i <= x1; i++) this.set(i, y, c); }
    vl(x, y0, y1, c) { for (let j = y0; j <= y1; j++) this.set(x, j, c); }
    dk(x, y, f) { x |= 0; y |= 0; if (x < 0 || y < 0 || x >= this.w || y >= this.h) return; const i = y * this.w + x, c = this.p[i]; if (c >>> 24) this.p[i] = scale(c, f); }

  const HEX = {

    // dense-wood greens (cooler, darker)

    // sand
    S0: '#9c7844', S1: '#c09c5c', S2: '#d8bc7c', S3: '#e8d49c', S4: '#f6eac4',

    // warm stone

    // slate roof

    // plaster

    // gold / wheat

    H0: '#7a5416', H1: '#a47c1e', H2: '#c89e2e', H3: '#e2be46', H4: '#f6e08a',

    // carpet / cloth

    // flowers & misc

    V1: '#2c5a30', V2: '#3e7a3c', // shutters

  };
  const P = {}; for (const k in HEX) P[k] = U(HEX[k]);

  // =====================================================================
  //  Terrain table (gameplay)
  // =====================================================================

    'h': '#7aa440', 'M': '#8c6c48', 's': '#dcc080', '~': '#5890e0', 'w': '#2250b4', 'b': '#9c5e2a', 'B': '#9c5e2a', 'r': '#7c7c88',
    'x': '#a09c98', 'X': '#5c5c6c', 'F': '#8c5a28', 'R': '#b43620', 'Q': '#3a5c98', '+': '#3a5c98', 'W': '#d8ccae', 'N': '#d8ccae',
    'D': '#74421e', 'S': '#8a8a96', 'G': '#8a8a96', 'K': '#74421e', 'l': '#6c6c80', 'k': '#9c5e2a', 'g': '#9a9aa4', 'P': '#3c8a2c',

    'a': '#e6e2d8', 'u': '#74421e', 'j': '#d8d8e8', 'v': '#e05818', 'n': '#5c3418', 'c': '#a08c6c', ' ': '#000000',
  };
  G.MINI_COLORS = MINI;
  G.drawMiniTile = function (ctx, code, x, y, size) {

  // =====================================================================
  //  Battle backdrops (320x224)
  // =====================================================================
  const BW = 320, BH = 224;
  const H = h => U(h);
  function bands(b, y0, y1, cols) {
    const n = cols.length, h = (y1 - y0) / n;
    for (let y = Math.max(0, y0); y < y1 && y < b.h; y++) {
      const i = Math.min(n - 1, Math.floor((y - y0) / h)), r = y - Math.round(y0 + i * h);
      for (let x = 0; x < b.w; x++) {
        let c = cols[i];
        if (i > 0) {
          if (r === 0 && ((x + y) & 1)) c = cols[i - 1];
          else if (r === 1 && (x & 3) === ((y & 1) << 1)) c = cols[i - 1];
          else if (r === -1) c = cols[i - 1];
        }
        b.set(x, y, c);
      }
    }
  }
  // smooth 1D value noise (fractal)
  function vnoise(x, seed) {
    const i = Math.floor(x), f = x - i, u = f * f * (3 - 2 * f);
    return hsh(i, seed, 1) * (1 - u) + hsh(i + 1, seed, 1) * u;
  }
  function fbm(x, seed, oct) { let a = 0, amp = 1, tot = 0; for (let o = 0; o < (oct || 4); o++) { a += vnoise(x, seed + o * 17) * amp; tot += amp; amp *= 0.5; x *= 2.03; } return a / tot; }
  // mountain range silhouette with lit/shade flanks, gullies and optional snow
  function mountains(b, R, yBase, yBot, count, hMin, hMax, pal, snow) {
    const pk = [];
    for (let i = 0; i < count; i++) pk.push({ x: -30 + (i + 0.2 + R() * 0.6) * ((BW + 60) / count), h: hMin + R() * (hMax - hMin), s: 0.5 + R() * 0.5 });
    const seed = Math.floor(R() * 1e6);
    for (let x = 0; x < b.w; x++) {
      let H = -1e9, p = null;
      for (const q of pk) { const t = q.h - Math.abs(x - q.x) * q.s; if (t > H) { H = t; p = q; } }
      const rough = (fbm(x / 22, seed, 4) - 0.5) * p.h * 0.45;
      const top = Math.round(yBase - H - rough);
      const peakTop = yBase - p.h;
      const lit = x < p.x;
      for (let y = Math.max(0, top); y < yBot; y++) {
        const depth = y - top;
        let c = lit ? pal.lt : pal.mid;
        // gullies running parallel to the flank
        const u = x + (y - peakTop) * (lit ? 1 : -1) * p.s * 0.9;
        const gv = vnoise(u / 3, seed + 5);
        if (depth > 2 && gv < 0.22) c = lit ? pal.mid : pal.sh;
        else if (!lit && depth > 1 && gv > 0.8) c = pal.lt === c ? c : pal.mid === c ? pal.lt : pal.mid;
        if (!lit && depth < 2) c = pal.sh;
        if (lit && depth < 1) c = pal.snowRim || c;
        if (snow && p.h > snow.min) {
          const sl = peakTop + snow.d + (fbm(x / 6, seed + 9, 3) - 0.5) * 10;
          if (y < sl) c = lit ? snow.lt : (gv < 0.3 ? snow.sh : snow.lt === c ? c : snow.sh);
        }
        if (y >= yBot - 8 && pal.base) { const f = (y - (yBot - 8)) / 8; if (hsh(x, y, seed) < f) c = pal.base; }
        b.set(x, y, c);
      }
    }
  }
  // flat-topped desert buttes with horizontal strata
  function mesas(b, R, yBase, count, pal) {
    for (let i = 0; i < count; i++) {
      const cx = R() * BW, w = 26 + R() * 50, h = 14 + R() * 26, top = yBase - h;
      const seed = Math.floor(R() * 1e5);
      for (let x = Math.floor(cx - w / 2 - h * 0.5); x < cx + w / 2 + h * 0.5; x++) {
        const edge = Math.abs(x - cx) - w / 2;
        const tt = edge < 0 ? top + fbm(x / 5, seed, 2) * 3 : top + edge * 2.2 + fbm(x / 5, seed, 2) * 3;
        for (let y = Math.max(0, Math.round(tt)); y < yBase; y++) {
          const lit = x < cx - w * 0.15;
          let c = lit ? pal.lt : pal.mid;
          if (x > cx + w * 0.3) c = pal.sh;
          const band = Math.floor((y - top) / 4 + vnoise(x / 9, seed) * 1.5);
          if (band % 3 === 2) c = c === pal.lt ? pal.mid : pal.sh;
          if (y - tt < 1.5) c = pal.top;
          b.set(x, y, c);
        }
      }
    }
  }
  function boulderBG(b, cx, cy, r) {
    for (let y = Math.floor(cy - r); y <= cy + r * 0.4; y++) for (let x = Math.floor(cx - r * 1.3); x <= cx + r * 1.3; x++) {
      const dx = (x - cx) / (r * 1.3), dy = (y - cy) / r, q = dx * dx + dy * dy;
      if (q > 1) continue;
      const l = -(dx * 0.7 + dy * 0.7);
      b.set(x, y, q > 0.8 && dx > -0.2 ? P.K1 : l > 0.5 ? P.K5 : l > 0.1 ? P.K4 : l > -0.3 ? P.K3 : P.K2);
    }
    for (let x = Math.floor(cx - r * 1.3); x <= cx + r * 1.4; x++) b.dk(x + 2, Math.round(cy + r * 0.4) + 1, 0.6);
  }
  // soft rolling hills
  function rolling(b, R, yBase, yBot, amp, pal) {
    const ph = [R() * TAU, R() * TAU, R() * TAU], f = [0.013 + R() * 0.01, 0.031 + R() * 0.01, 0.07];
    const seed = Math.floor(R() * 1e6);
    for (let x = 0; x < b.w; x++) {
      const hgt = amp * (0.55 * Math.sin(x * f[0] + ph[0]) + 0.3 * Math.sin(x * f[1] + ph[1]) + 0.12 * Math.sin(x * f[2] + ph[2]));
      const top = Math.round(yBase - hgt);
      const slope = amp * (0.55 * f[0] * Math.cos(x * f[0] + ph[0]) + 0.3 * f[1] * Math.cos(x * f[1] + ph[1]));
      for (let y = Math.max(0, top); y < yBot; y++) {
        let c = pal.mid;
        const d = y - top;
        if (d < 2) c = pal.lt;
        else if (slope > 0.12 && d < 10 && ((x + y) & 1)) c = pal.lt;
        else if (slope < -0.15 && d < 12) c = ((x + y) & 1) ? pal.sh : pal.mid;
        if (pal.dots && hsh(x, y, seed) < 0.02) c = pal.dots;
        b.set(x, y, c);
      }
    }
  }
  function treeLine(b, R, yBase, yBot, rMin, rMax, pal) {
    let x = -8;
    const seed = Math.floor(R() * 1e6);
    while (x < b.w + 10) {
      const r = rMin + R() * (rMax - rMin), cy = yBase - r * (0.3 + R() * 0.7);
      for (let y = Math.floor(cy - r); y < yBot; y++) for (let xx = Math.floor(x - r); xx <= x + r; xx++) {
        const dx = xx + 0.5 - x, dy = y + 0.5 - cy, d = Math.hypot(dx, dy);
        if (y < cy && d > r) continue;
        if (y >= cy && Math.abs(dx) > r) continue;
        let c = pal.mid;
        if (y < cy + r * 0.3) {
          const l = -(dx * 0.6 + dy * 0.8) / r + (hsh(xx >> 1, y >> 1, seed) - 0.5) * 0.5;
          c = l > 0.45 ? pal.lt : l > -0.2 ? pal.mid : pal.sh;
          if (d > r - 1 && dx > 0) c = pal.sh;
        } else c = ((xx + y) & 1) && y < cy + r ? pal.mid : pal.sh;
        b.set(xx, y, c);
      }
      x += r * (0.9 + R() * 0.6);
    }
  }
  function pinesLine(b, R, yBase, yBot, hMin, hMax, pal) {
    let x = -6;
    while (x < b.w + 8) {
      const h = hMin + R() * (hMax - hMin), top = yBase - h, w = h * 0.3;
      for (let y = Math.floor(top); y < yBot; y++) {
        const t = Math.min(1, (y - top) / h), tier = (t * 4) % 1;

          const dx = xx + 0.5 - x;

        }

      x += w * (1.0 + R() * 0.8);

  // perspective striped ground
  function groundStripes(b, hy, y1, c1, c2, C) {
    for (let y = hy; y < y1; y++) {
      const z = y - hy + 2, bw = z * z / C;
      const idx = Math.floor(C / z);
      for (let x = 0; x < b.w; x++) {
        let c = (idx & 1) ? c1 : c2;

      }
    }
  }
  function tufts(b, R, hy, y1, count, pal) {
    for (let i = 0; i < count; i++) {
      const t = Math.pow(R(), 0.7), y = Math.round(hy + 3 + t * (y1 - hy - 4)), x = Math.round(R() * BW);
      const s = 1 + Math.round(t * 3);
      for (let k = -s; k <= s; k++) {
        const hgt = Math.round((s + 1) * (1 - Math.abs(k) / (s + 1.5)) * (0.7 + (k & 1) * 0.5));
        for (let j = 0; j < hgt; j++) b.set(x + k, y - j, j === hgt - 1 ? pal[2] : pal[1]);

  }
  function pebbles(b, R, hy, y1, count, pal) {
    for (let i = 0; i < count; i++) {
      const t = Math.pow(R(), 0.8), y = Math.round(hy + 2 + t * (y1 - hy - 3)), x = Math.round(R() * BW);

  function cloud(b, cx, cy, w, R, pal) {
    const puffs = [], n = 4 + Math.floor(R() * 3);

      else if (d < r * 2 && (x & 1) && (y & 1)) b.tint(x, y, halo, 0.3);
    }
  }

  // ---- house row for the town backdrop ----
  function house(b, R, x, w, groundY, wallH, roofH, roofPal, haze) {
    const hz = c => haze ? mix(c, haze[0], haze[1]) : c;
    const wallTop = groundY - wallH;
    // roof (front slope, trapezoid with overhang)
    for (let y = wallTop - roofH; y < wallTop + 2; y++) {
      const t = (y - (wallTop - roofH)) / roofH, inset = Math.round((1 - Math.min(1, t)) * roofH * 0.5);
      for (let xx = x - 2 + inset; xx < x + w + 2 - inset; xx++) {
        const ly = (y - (wallTop - roofH)) % 4;
        let c = ly === 3 ? roofPal[0] : ly === 0 ? roofPal[3] : roofPal[2];
        if (xx === x - 2 + inset) c = roofPal[3]; if (xx === x + w + 1 - inset) c = roofPal[0];
        if (y >= wallTop) c = roofPal[0];
        if (y === wallTop - roofH) c = roofPal[0];
        b.set(xx, y, hz(c));
      }
    }
    // chimney
    if (R() < 0.6) { const cx = x + Math.floor(w * (0.2 + R() * 0.5)), ch = Math.floor(roofH * 0.9); for (let y = wallTop - roofH - 4; y < wallTop - roofH + ch * 0.5; y++) for (let xx = cx; xx < cx + 5; xx++) b.set(xx, y, hz(xx === cx ? P.K4 : xx === cx + 4 ? P.K1 : P.K3)); }
    // wall
    for (let y = wallTop + 2; y < groundY; y++) for (let xx = x; xx < x + w; xx++) {
      let c = P.P3;
      if (y > groundY - 5) c = ((xx + Math.floor(y / 2) * 3) % 6 === 0 || (y % 2 === 0)) ? P.K2 : P.K3;
      if (xx === x || xx === x + w - 1 || xx === x + 1) c = P.T1;
      if (y === wallTop + 2 || y === wallTop + 3) c = P.T1;
      b.set(xx, y, hz(c));
    }
    // windows & door
    const doorX = x + Math.floor(w / 2 - 4 + (R() - 0.5) * w * 0.3);
    for (let y = groundY - 17; y < groundY; y++) for (let xx = doorX; xx < doorX + 9; xx++) b.set(xx, y, hz(xx === doorX || xx === doorX + 8 || y === groundY - 17 ? P.T0 : ((xx - doorX) % 3 === 0 ? P.T2 : P.T3)));
    for (let wx = x + 5; wx + 9 < x + w - 3; wx += 16) {
      if (wx + 9 > doorX - 1 && wx < doorX + 10) continue;
      const wy = wallTop + 8;

        let c = (xx === wx || xx === wx + 8 || y === wy || y === wy + 9 || xx === wx + 4 || y === wy + 5) ? P.T1 : ((xx - wx) - (y - wy) > 1 && (xx - wx) - (y - wy) < 4 ? P.W4 : P.W1);

      }
    }
  }

  const BG = {};
  function buildBG(key) {
    const sky = new Buf(BW, BH), front = new Buf(BW, BH);
    let clouds = null, R = rng(key.split('').reduce((a, c) => a * 31 + c.charCodeAt(0), 7));
    const SKY_DAY = ['#2040b8', '#2a4ec4', '#3460d0', '#3e70d8', '#4c80e0', '#5c92e8', '#70a6f0', '#88baf4', '#a4ccf8', '#c0dcf8'].map(H);

    const farMtn = { lt: H('#8c9cd4'), mid: H('#6c7cbc'), sh: H('#5664a4'), base: H('#98b0dc') };
    const snowC = { lt: H('#f0f4ff'), sh: H('#b8c4e8'), min: 34, d: 9 };
    const G_ = [P.G1, P.G2, P.G5];
    switch (key) {
      case 'road':
      case 'grass': {

        mountains(front, R, 108, 124, 7, 18, 52, farMtn, snowC);
        rolling(front, R, 112, 124, 9, { lt: H('#78b46c'), mid: H('#5c9c5c'), sh: H('#4c8454') });

        groundStripes(front, 124, BH, P.G3, H('#48942c'), 420);

          // horizontal dirt road across the fighting band

            const edge = y < 146 || y > 201;

              const j = Math.sin(x * 0.07 + y) * 1.5;

          for (let i = 0; i < 26; i++) { const x = Math.floor(R() * BW), y = 150 + Math.floor(R() * 70); const c = [P.F1, P.F2, P.F3, P.F4][i % 4]; front.set(x, y, c); front.set(x + 1, y, c); front.set(x, y - 1, c); front.set(x + 1, y + 1, P.G1); }
        }
        break;
      }
      case 'forest': {
        bands(sky, 0, 130, ['#6ca44c', '#5c9444', '#4c843c', '#3e7434', '#30642c'].map(H));
        // distant trunks
        const trunkRow = (count, wMin, wMax, col, colL, y0, y1) => {
          for (let i = 0; i < count; i++) {
            const x = Math.floor(R() * BW), w = wMin + Math.floor(R() * (wMax - wMin));
            for (let y = y0; y < y1; y++) for (let xx = x; xx < x + w; xx++) front.set(xx, y, xx === x ? colL : ((xx - x) > w * 0.6 ? scale(col, 0.8) : col));
          }
        };
        trunkRow(26, 3, 6, H('#2c4c2c'), H('#3c6038'), 0, 130);
        treeLine(front, R, 40, 44, 12, 22, { lt: H('#4c8c3c'), mid: H('#2c6428'), sh: H('#1c4418') });
        trunkRow(12, 7, 13, H('#4c3420'), H('#6c4c2c'), 20, 140);
        // canopy overhead
        for (let x = 0; x < BW; x++) {
          const hgt = 22 + Math.sin(x * 0.05) * 8 + Math.sin(x * 0.13 + 1) * 5 + hsh(x >> 2, 0, 5) * 4;
          for (let y = 0; y < hgt; y++) {
            const l = hsh(x >> 1, y >> 1, 9);
            front.set(x, y, y > hgt - 3 ? P.J1 : l < 0.25 ? P.J4 : l < 0.6 ? P.J3 : P.J2);
          }
        }
        // light shafts
        for (const [sx, w] of [[70, 14], [190, 10], [260, 18]]) for (let y = 30; y < 150; y++) for (let x = sx + (y - 30) * 0.4; x < sx + w + (y - 30) * 0.4; x++) if (((Math.floor(x) + y) & 1) === 0) front.tint(x, y, H('#e8f0a0'), 0.18);

        groundStripes(front, 136, BH, H('#467a2a'), H('#3e6e26'), 380);
        for (let i = 0; i < 260; i++) { const t = R(), y = Math.round(138 + t * 86), x = Math.floor(R() * BW); const c = [H('#6c5020'), H('#8c6c28'), P.J4, H('#a07830')][i % 4]; front.set(x, y, c); if (t > 0.4) front.set(x + 1, y, c); }
        tufts(front, R, 138, BH, 60, [P.J1, P.J3, P.J5]);
        break;
      }
      case 'hills': {
        bands(sky, 0, 126, SKY_DAY);
        clouds = cloudLayer(21, 6, 12, 60, CLOUD, 50, 100);
        mountains(front, R, 100, 126, 6, 30, 70, farMtn, snowC);

  // ------------------------------------------------------------------

  function drawWeapon(B, spec, P, hand, ang, k, pose, far) {

    } else if (w === 'mace') {

  function drawBow(B, spec, hand, ang, k, drawHand, arrow) {
    const d = dirv(ang), n = [-d[1], d[0]];
