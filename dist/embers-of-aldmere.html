<script>/* src/rules.js */
// ===== Rules: stats, land effect, turn order, combat resolution, EXP (SF2-style formulas) =====
'use strict';
(function () {
  const R = G.rules = {};
  const D = () => G.data;

  // ---------- Stat helpers (work for both party members and enemies) ----------
  R.cls = u => u.enemy ? null : D().classes[u.cls];
  R.moveType = u => u.enemy ? u.kind.move : R.cls(u).move;
  R.isArcher = u => u.enemy ? !!u.kind.archer : !!R.cls(u).archer;
  R.isFlyer = u => { const m = R.moveType(u); return m === 'flying' || m === 'hover'; };
  R.weapon = u => { const it = (u.items || []).find(i => i.eq && D().items[i.id].type === 'weapon'); return it ? D().items[it.id] : null; };
  R.ring = u => { const it = (u.items || []).find(i => i.eq && D().items[i.id].type === 'ring'); return it ? D().items[it.id] : null; };
  R.stat = function (u, s) {
    let v = u[s] || 0;
    if (!u.enemy) {
      if (s === 'att') { const w = R.weapon(u); if (w) v += w.att; }
      const r = R.ring(u); if (r && r.bonus[s]) v += r.bonus[s];
    }
    if (u.status) {
      if (u.status.quick && (s === 'agi' || s === 'def')) v += u.status.quickPow || 5;
      if (u.status.sap && (s === 'agi' || s === 'def')) v -= u.status.sapPow || 5;
    }
    return Math.max(0, v);
  };
  R.range = function (u) {
    if (u.enemy) return u.kind.range;
    const w = R.weapon(u); return w ? w.range : [1, 1];
  };
  R.prowess = function (u) {
    const src = u.enemy ? u.kind : R.cls(u);
    return { crit: src.crit || [32, 0.25], dbl: src.dbl || 32, ctr: src.ctr || 32, critPoison: !!src.critPoison };
  };
  R.effLevel = u => u.lv + (!u.enemy && R.cls(u).promoted ? 20 : 0);
  R.mov = function (u) {
    if (u.enemy) return u.kind.mov;
    let m = R.cls(u).mov; if (u.status && u.status.sap) m = Math.max(1, m - 1); return m;
  };

  // ---------- Terrain ----------
  R.terrain = code => G.TERRAIN[code] || G.TERRAIN['.'];
  R.moveCost = function (u, code) {
    const t = R.terrain(code); const m = R.moveType(u);
    const key = m === 'flying' ? 'flying' : m === 'hover' ? 'hover' : m === 'mounted' ? 'mounted' : 'foot';
    const c = t.cost[key]; return c == null ? Infinity : c;
  };
  R.landEffect = function (u, code) {
    if (R.moveType(u) === 'flying') return 0; // fliers never benefit from terrain
    return R.terrain(code).le || 0;
  };

  // ---------- Turn order ----------
  R.turnOrder = function (units) {
    const list = [];
    units.forEach(u => {
      if (u.hp <= 0 || u.gone) return;
      const agi = R.stat(u, 'agi');
      const base = agi & 127; // cap before variance
      let v = base + G.r(Math.floor(base / 8) + 1) - G.r(Math.floor(base / 8) + 1) + (G.r(3) - 1);
      list.push({ u, v });
      if (agi >= 128) { const a2 = Math.floor(base * 5 / 6); list.push({ u, v: a2 + G.r(Math.floor(a2 / 8) + 1) - G.r(Math.floor(a2 / 8) + 1) }); }
    });
    list.sort((a, b) => b.v - a.v);
    return list.map(e => e.u);
  };

  // ---------- EXP ----------
  R.killExp = function (actor, target) {
    const diff = R.effLevel(actor) - R.effLevel(target);
    if (diff < 3) return 50; if (diff === 3) return 40; if (diff === 4) return 30; if (diff === 5) return 20; if (diff === 6) return 10; return 0;
  };
  R.finalizeExp = function (x) {
    if (G.chance(16)) x++; if (G.chance(16)) x--; return Math.max(1, x);
  };

  // ---------- Physical attack ----------
  // returns {dodge, dmg, crit, poison}
  R.rollAttack = function (att, tgt, tgtTile, isCounter) {
    const res = { dodge: false, dmg: 0, crit: false, poison: false };
    const asleep = tgt.status && (tgt.status.sleep || tgt.status.stun);
    if (!asleep) {
      let n = 32;
      if (att.status && att.status.muddle) n = 2;
      else if (R.isFlyer(tgt) && !R.isArcher(att)) n = 8;
      if (G.chance(n)) { res.dodge = true; return res; }
    }
    let d = R.stat(att, 'att') - R.stat(tgt, 'def');
    if (d <= 0) d = 1;
    const le = R.landEffect(tgt, tgtTile);
    if (le === 15) d = Math.floor(d * 230 / 256); else if (le >= 30) d = Math.floor(d * 205 / 256);
    if (R.isFlyer(tgt) && R.isArcher(att)) d += Math.floor(d / 4);
    const p = R.prowess(att);
    if (G.chance(p.crit[0])) {
      res.crit = true;
      if (p.critPoison) res.poison = true; else d += Math.floor(d * p.crit[1]);
    }
    if (isCounter) d = Math.floor(d / 2);
    d = R.variance(d);
    res.dmg = d;
    return res;
  };
  R.variance = function (d) {
    const k = Math.floor(d / 8) + 1;
    d -= G.r(k); d -= G.r(k);
    return Math.max(1, d);
  };

  // ---------- Spells ----------
  R.spellPower = function (caster, spellId, lvl, target) {
    const sp = D().spells[spellId], L = sp.levels[lvl - 1];
    let p = L.power;
    if (!caster.enemy && R.cls(caster).promoted) p = Math.floor(p * 5 / 4);
    if (sp.kind === 'damage') {
      const res = target.enemy ? (target.kind.resist || {})[sp.elem] : null;
      const q = Math.floor(p / 4);
      if (res === 'minor') p -= q; else if (res === 'major') p = Math.floor(p / 2); else if (res === 'weak') p += q;
      let crit = false;
      if (G.chance(32)) { p += q; crit = true; }
      return { dmg: R.variance(p), crit, resist: res };
    }
    return { amount: p };
  };
  R.spellLevelsKnown = function (u) {
    // returns [{id, lv}] highest level learned for each
    if (u.enemy) return (u.kind.spells || []).map(([id, lv]) => ({ id, lv }));
    return Object.keys(u.spells || {}).map(id => ({ id, lv: u.spells[id] })).filter(s => s.lv > 0);
  };

  // ---------- Leveling ----------
  const STATS = ['hp', 'mp', 'att', 'def', 'agi'];
  R.targetStat = function (u, s) {
    const c = D().chars[u.id]; const curve = D().curves[c.curve] || D().curves.linear;
    if (R.cls(u).promoted) {
      const base = u.promoBase[s], g = c.pgrowth[s];
      const L = Math.min(u.lv, 20); let t = base + g * curve(L);
      if (u.lv > 20) t += (u.lv - 20) * g / 40;
      return t;
    }
    const [a, b] = c.stats[s];
    if (u.lv <= 20) return a + (b - a) * curve(u.lv);
    return b + (u.lv - 20) * (b - a) / 38;
  };
  // apply one level up; returns gains object
  R.levelUp = function (u) {
    u.lv++;
    const gains = {};
    STATS.forEach(s => {
      const key = s === 'hp' ? 'mhp' : s === 'mp' ? 'mmp' : s;
      const cur = u[key];
      const t = R.targetStat(u, s);
      if (t <= 0 && cur <= 0) { gains[s] = 0; return; }
      let g = t - cur;
      // random variance around the projected curve: -1..+2 (rare), never negative
      const rv = G.r(8); g += rv === 0 ? -1 : rv >= 6 ? 1 : 0; if (G.chance(24)) g += 2;
      g = Math.max(0, Math.round(g));
      if (s === 'hp' || s === 'mp' || s === 'att' || s === 'def' || s === 'agi') { if (g === 0 && t > cur + 0.3 && G.chance(2)) g = 1; }
      u[key] = cur + g; gains[s] = g;
      if (s === 'hp') u.hp += g; if (s === 'mp') u.mp += g;
    });
    // spells learned
    const learned = [];
    const c = D().chars[u.id];
    (c.spells || []).forEach(([id, ...lvls]) => {
      if (R.cls(u).promoted) return; // spells are learned during base-class levels in this model; promoted: handled by promoLearn
      lvls.forEach((L, i) => { if (u.lv === L && (u.spells[id] || 0) < i + 1) { u.spells[id] = i + 1; learned.push({ id, lv: i + 1 }); } });
    });
    if (R.cls(u).promoted) {
      (c.spells || []).forEach(([id, ...lvls]) => {
        lvls.forEach((L, i) => { const eff = u.lv + 20; if ((u.spells[id] || 0) < i + 1 && eff >= L && L > u.promoLv) { u.spells[id] = i + 1; learned.push({ id, lv: i + 1 }); } });
      });
    }
    return { gains, learned };
  };
  R.maxLevel = u => R.cls(u).promoted ? 99 : 40;
})();

</script>
<script>/* src/state.js */
// ===== Game state: party roster, inventory, flags, save/load =====
'use strict';
(function () {
  const D = () => G.data;
  const S = G.st = {};

  S.newGame = function () {
    G.state = {
      gold: 60, members: {}, party: [], depot: [], flags: {}, chapter: 1,
      loc: { map: 'tallowmere', x: 0, y: 0, dir: 'down' },
      church: { map: 'tallowmere', x: 0, y: 0 }, battlesWon: {}, playTime: 0, searched: {},
    };
  };
  S.makeMember = function (id) {
    const c = D().chars[id];
    const u = { id, name: c.name, cls: c.cls, lv: 1, exp: 0, items: [], spells: {}, status: {}, dead: false, kills: 0, defeats: 0 };
    u.mhp = c.stats.hp[0]; u.mmp = c.stats.mp[0]; u.att = c.stats.att[0]; u.def = c.stats.def[0]; u.agi = c.stats.agi[0];
    (c.spells || []).forEach(([sid, ...lv]) => { u.spells[sid] = 0; lv.forEach((L, i) => { if (L <= 1) u.spells[sid] = i + 1; }); });
    u.hp = u.mhp; u.mp = u.mmp;
    // grow to starting level
    const saveR = G.rngState; G.rngState = (id.length * 7919 + 17) >>> 0;
    while (u.lv < c.lv) G.rules.levelUp(u);
    G.rngState = saveR;
    u.hp = u.mhp; u.mp = u.mmp;
    c.items.forEach(iid => u.items.push({ id: iid, eq: iid === c.equip }));
    return u;
  };
  S.join = function (id) {
    if (G.state.members[id]) return G.state.members[id];
    const u = S.makeMember(id); G.state.members[id] = u;
    if (G.state.party.length < 12) G.state.party.push(id); // active force (max 12 in battle)
    return u;
  };
  S.member = id => G.state.members[id];
  S.roster = () => Object.keys(G.state.members).map(S.member);
  S.active = () => G.state.party.map(S.member);
  S.leader = () => S.member('rowan');

  // ---------- Inventory ----------
  S.giveItem = function (id, preferred) {
    // put into first member with a free slot (preferred first); else depot
    const list = (preferred ? [S.member(preferred)] : []).concat(S.active()).filter(Boolean);
    for (const u of list) if (u.items.length < 4) { u.items.push({ id, eq: false }); return u; }
    G.state.depot.push(id); return null;
  };
  S.canEquip = function (u, itemId) {
    const it = D().items[itemId]; if (!it) return false;
    if (it.type === 'ring') return true;
    if (it.type !== 'weapon') return false;
    return D().classes[u.cls].weapons.includes(it.wtype);
  };
  S.equip = function (u, idx) {
    const it = D().items[u.items[idx].id];
    u.items.forEach((x, i) => { if (D().items[x.id].type === it.type) x.eq = false; });
    u.items[idx].eq = true;
  };

  // ---------- Healing, death, promotion ----------
  S.healAll = function () { S.roster().forEach(u => { if (!u.dead) { u.hp = u.mhp; u.mp = u.mmp; } u.status = {}; }); };
  S.revive = u => { u.dead = false; u.hp = u.mhp; u.mp = u.mmp; u.status = {}; };
  S.reviveCost = u => Math.max(10, u.lv * 10 * (D().classes[u.cls].promoted ? 3 : 1));
  S.cureCost = u => 10;
  S.canPromote = u => { const c = D().classes[u.cls]; return !c.promoted && c.promo && u.lv >= 20; };
  S.promote = function (u) {
    const c = D().classes[u.cls];
    u.promoLv = u.lv; u.cls = c.promo; u.lv = 1; u.exp = 0;
    u.promoBase = { hp: u.mhp, mp: u.mmp, att: u.att, def: u.def, agi: u.agi };
  };

  // ---------- Save / load (3 slots, like a church journal) ----------
  S.save = function (slot = 1) {
    G.state.savedAt = Date.now();
    return G.store.set('embers_save_' + slot, G.state);
  };
  S.load = function (slot = 1) {
    const s = G.store.get('embers_save_' + slot); if (!s) return false;
    G.state = s; return true;
  };
  S.hasSave = slot => !!G.store.get('embers_save_' + slot);
  S.saveInfo = function (slot) {
    const s = G.store.get('embers_save_' + slot); if (!s) return null;
    const r = s.members.rowan;
    return { lv: r ? r.lv : 1, gold: s.gold, where: s.loc.map, time: s.playTime };
  };
})();

</script>
<script>/* src/menus.js */
// ===== Menus: status screen, spell/item lists, give/equip, shops, church, caravan, field menu =====
'use strict';
(function () {
  const D = () => G.data, R = () => G.rules, S = () => G.st;

  // ---------- Status screen ----------
  class StatusScreen {
    constructor(u, w) { this.u = u; this.w = w; this.t = 0; this.transparent = false; }
    update() { this.t++; if (G.input.p('A') || G.input.p('B') || G.input.p('C')) { G.audio.sfx('cancel'); G.pop(); this.w.resolve(); } }
    draw(ctx) {
      const u = this.u;
      ctx.fillStyle = '#080c28'; ctx.fillRect(0, 0, G.W, G.H);
      const portrait = u.enemy ? (u.kind.portrait || null) : D().chars[u.id].portrait;
      G.win(ctx, 6, 6, 62, 62);
      if (portrait) G.drawPortrait(ctx, portrait, 11, 11, this.t);
      else { const img = G.battleSprite(u.kind.map, 'idle', 'right'); ctx.drawImage(img, 0, 0, 96, 96, 9, 9, 56, 56); }
      G.win(ctx, 72, 6, G.W - 78, 62);
      G.text(ctx, u.name, 82, 13, u.enemy ? '#ff9090' : '#fff');
      if (!u.enemy) {
        const c = D().classes[u.cls];
        G.text(ctx, c.name + (c.promoted ? ' *' : ''), 82, 25, '#a0c0ff');
        G.text(ctx, 'LEVEL ' + u.lv, 82, 37); G.text(ctx, 'EXP ' + u.exp + '/100', 150, 37);
        G.text(ctx, 'Kills ' + (u.kills || 0) + '  Defeats ' + (u.defeats || 0), 82, 49, '#c0c8e8');
        if (u.dead) G.textR(ctx, 'FALLEN', G.W - 14, 13, '#ff6060');
      } else { G.text(ctx, 'LEVEL ' + u.lv, 82, 25, '#a0c0ff'); }
      // stats
      G.win(ctx, 6, 72, 150, 88);
      G.text(ctx, 'HP', 16, 80, '#a0c0ff'); G.bar(ctx, 34, 81, 60, u.hp, u.mhp); G.textR(ctx, u.hp + '/' + u.mhp, 148, 80);
      G.text(ctx, 'MP', 16, 92, '#a0c0ff'); G.bar(ctx, 34, 93, 60, u.mp, u.mmp, '#60a0ff'); G.textR(ctx, u.mp + '/' + u.mmp, 148, 92);
      const rows = [['ATT', R().stat(u, 'att')], ['DEF', R().stat(u, 'def')], ['AGI', R().stat(u, 'agi')], ['MOV', R().mov(u)]];
      rows.forEach(([k, v], i) => { G.text(ctx, k, 16, 106 + i * 12, '#a0c0ff'); G.textR(ctx, String(v), 70, 106 + i * 12); });
      const st = [];
      if (u.status.poison) st.push(['Poison', '#60e060']); if (u.status.quick) st.push(['Quick', '#80c0ff']); if (u.status.sap) st.push(['Sapped', '#e080e0']);
      st.forEach(([s, c], i) => G.text(ctx, s, 90, 106 + i * 12, c));
      // items
      G.win(ctx, 160, 72, G.W - 166, 88);
      G.text(ctx, 'ITEMS', 170, 79, '#f8e060');
      const items = u.enemy ? [] : u.items;
      for (let i = 0; i < 4; i++) { const it = items[i]; G.text(ctx, it ? (it.eq ? 'E ' : '  ') + D().items[it.id].name : '  -', 170, 91 + i * 12, it && it.eq ? '#fff' : '#c0c8e8'); }
      if (!u.enemy) { const w = R().weapon(u); G.text(ctx, 'Range ' + (w ? w.range.join('-') : '1'), 170, 141, '#a0c0ff'); }
      // magic
      G.win(ctx, 6, 164, G.W - 12, 54);
      G.text(ctx, 'MAGIC', 16, 171, '#f8e060');
      const sp = R().spellLevelsKnown(u);
      if (!sp.length) G.text(ctx, 'None', 16, 184, '#8088b0');
      sp.forEach((s, i) => { const x = 16 + (i % 3) * 100, y = 184 + Math.floor(i / 3) * 12; G.text(ctx, D().spells[s.id].name + ' ' + s.lv, x, y); });
      if (!u.enemy) G.text(ctx, D().chars[u.id].bio, 16, 207, '#b0b8d8');
    }
  }
  G.statusScreen = function (u) { const w = new G.Wait(); G.push(new StatusScreen(u, w)); return w; };

  // ---------- Spell menu (list + level with left/right) ----------
  class SpellMenu {
    constructor(u, opts, w) {
      this.u = u; this.w = w; this.opts = opts || {}; this.transparent = true; this.t = 0;
      this.list = R().spellLevelsKnown(u).filter(s => !this.opts.field || D().spells[s.id].field || D().spells[s.id].kind === 'heal' || D().spells[s.id].kind === 'cure');
      this.i = 0; this.lv = this.list.map(s => s.lv);
    }
    update() {
      this.t++;
      if (!this.list.length) { if (G.input.p('A') || G.input.p('B')) { G.pop(); this.w.resolve(null); } return; }
      const d = G.input.repDir(14, 6);
      if (d === 'up' || d === 'down') { this.i = (this.i + (d === 'up' ? -1 : 1) + this.list.length) % this.list.length; G.audio.sfx('cursor'); }
      if (d === 'left' || d === 'right') { const s = this.list[this.i]; this.lv[this.i] = G.clamp(this.lv[this.i] + (d === 'left' ? -1 : 1), 1, s.lv); G.audio.sfx('cursor'); }
      if (G.input.p('A')) {
        const s = this.list[this.i], L = D().spells[s.id].levels[this.lv[this.i] - 1];
        if (this.u.mp < L.mp) { G.audio.sfx('error'); return; }
        G.audio.sfx('ok'); G.pop(); this.w.resolve({ id: s.id, lv: this.lv[this.i] });
      }
      if (G.input.p('B')) { G.audio.sfx('cancel'); G.pop(); this.w.resolve(null); }
    }
    draw(ctx) {
      const x = 8, y = 8, w = 200, h = 22 + Math.max(1, this.list.length) * 12;
      G.win(ctx, x, y, w, h);
      G.text(ctx, this.u.name + '  MP ' + this.u.mp + '/' + this.u.mmp, x + 10, y + 7, '#f8e060');
      if (!this.list.length) G.text(ctx, 'No usable spells.', x + 18, y + 20, '#8088b0');
      this.list.forEach((s, i) => {
        const sp = D().spells[s.id], L = sp.levels[this.lv[i] - 1];
        const ok = this.u.mp >= L.mp;
        const yy = y + 20 + i * 12;
        if (i === this.i && (this.t >> 3) % 4 !== 3) G.text(ctx, '\u0002', x + 8, yy, '#f8e060');
        G.text(ctx, sp.name, x + 18, yy, ok ? '#fff' : '#7078a0');
        let lx = x + 90;
        for (let k = 1; k <= s.lv; k++) { G.text(ctx, String(k), lx, yy, k === this.lv[i] ? (ok ? '#f8e060' : '#a08040') : '#6070a0'); lx += 10; }
        G.textR(ctx, L.mp + 'MP', x + w - 10, yy, ok ? '#a0c0ff' : '#7078a0');
      });
      if (this.list.length) {
        const s = this.list[this.i], sp = D().spells[s.id], L = sp.levels[this.lv[this.i] - 1];
        const info = { heal: 'Restores HP', cure: 'Cures ailments', buff: 'Raises AGI & DEF', debuff: 'Lowers AGI & DEF', recall: 'Return to the last church', damage: 'Damages foes', poison: 'Poisons foes' }[sp.kind];
        G.win(ctx, 8, y + h + 4, 200, 32);
        G.text(ctx, info + (L.power ? ' (' + (L.power >= 999 ? 'full' : L.power) + ')' : ''), 18, y + h + 10);
        G.text(ctx, 'Range ' + L.range.join('-') + '  Area ' + (L.area ? L.area * 2 + 1 + 'x' : 'single'), 18, y + h + 21, '#a0c0ff');
      }
    }
  }
  G.spellMenu = function (u, opts) { const w = new G.Wait(); G.push(new SpellMenu(u, opts, w)); return w; };

  // ---------- Item lists ----------
  G.itemLabel = it => (it.eq ? 'E ' : '') + D().items[it.id].name;
  G.itemList = function (u, opts = {}) {
    const items = u.items.map(it => ({ label: G.itemLabel(it), color: it.eq ? '#f8f0a0' : null }));
    return G.menu(items, Object.assign({ x: 8, y: 8, w: 150, title: opts.title, help: i => u.items[i] ? D().items[u.items[i].id].desc : '' }, opts));
  };
  G.giveItemFlow = function* (from, idx, to) {
    const it = from.items[idx];
    if (from === to) return;
    if (to.items.length < 4) {
      from.items.splice(idx, 1); it.eq = false; to.items.push(it); G.audio.sfx('item');
      yield G.say(from.name + ' gives the ' + D().items[it.id].name + ' to ' + to.name + '.');
      yield* G.offerEquip(to, to.items.length - 1);
      return;
    }
    yield G.say(to.name + '\'s hands are full. Swap for which item?');
    const w = yield G.itemList(to, { title: 'Swap with' });
    if (w.result < 0) return;
    const other = to.items[w.result];
    from.items[idx] = other; other.eq = false; to.items[w.result] = it; it.eq = false; G.audio.sfx('item');
    yield G.say(from.name + ' and ' + to.name + ' trade items.');
    yield* G.offerEquip(to, w.result);
  };
  G.offerEquip = function* (u, idx) {
    const id = u.items[idx].id; if (!S().canEquip(u, id)) return;
    yield G.say('Equip the ' + D().items[id].name + ' on ' + u.name + '?');
    const c = yield G.confirm(); if (c.result === 0) { S().equip(u, idx); G.audio.sfx('ok'); }
  };

  // ---------- Member picker ----------
  G.memberPick = function (opts = {}) {
    const list = opts.list || S().active();
    const items = list.map(u => ({ label: u.name, right: D().classes[u.cls].name.slice(0, 9) + ' L' + u.lv + (u.dead ? ' X' : ''), disabled: opts.filter ? !opts.filter(u) : false, color: u.dead ? '#ff8080' : null }));
    const w = G.menu(items, Object.assign({ x: 8, y: 8, w: 190, title: opts.title || 'Who?', maxRows: 9 }, opts));
    const out = new G.Wait();
    const chk = { done: () => { if (w.done() && !out.fin) out.resolve(w.result >= 0 ? list[w.result] : null); return w.done(); } };
    out.done = () => { chk.done(); return out.fin; };
    return out;
  };

  // ---------- Field menu (Member / Magic / Item / Search) ----------
  G.fieldMenu = function* (field) {
    while (true) {
      const c = yield G.cross({ up: { label: 'Member', icon: 'member' }, left: { label: 'Magic', icon: 'magic' }, right: { label: 'Item', icon: 'item' }, down: { label: 'Search', icon: 'search' } }, { x: G.W / 2 - 40, y: G.H / 2 + 20 });
      const op = c.result; if (!op) return;
      if (op === 'up') {
        while (true) { const m = yield G.memberPick({ title: 'Member' }); if (!m.result) break; yield G.statusScreen(m.result); }
      } else if (op === 'left') {
        const m = yield G.memberPick({ title: 'Cast with', filter: u => !u.dead && R().spellLevelsKnown(u).some(s => ['heal', 'cure', 'recall'].includes(D().spells[s.id].kind)) });
        if (!m.result) continue;
        const u = m.result;
        const s = yield G.spellMenu(u, { field: true }); if (!s.result) continue;
        yield* G.fieldCast(u, s.result.id, s.result.lv);
      } else if (op === 'right') {
        const m = yield G.memberPick({ title: 'Whose items?' }); if (!m.result) continue;
        yield* G.fieldItems(m.result);
      } else if (op === 'down') {
        yield* field.search(); return;
      }
    }
  };
  G.fieldCast = function* (u, id, lv) {
    const sp = D().spells[id], L = sp.levels[lv - 1];
    if (sp.kind === 'recall') {
      yield G.say('Return to the last church visited?'); const c = yield G.confirm(); if (c.result !== 0) return;
      u.mp -= L.mp; G.audio.sfx('warp'); G.fx.flash = 20; yield 30; G.recallToChurch(); return;
    }
    const t = yield G.memberPick({ title: 'Cast on', filter: x => !x.dead }); if (!t.result) return;
    const x = t.result; u.mp -= L.mp;
    if (sp.kind === 'heal') { const amt = Math.min(x.mhp - x.hp, R().spellPower(u, id, lv, x).amount); x.hp += amt; G.audio.sfx('heal'); yield G.say(x.name + ' recovers ' + amt + ' HP.'); }
    else if (sp.kind === 'cure') { x.status = {}; G.audio.sfx('heal'); yield G.say(x.name + ' is cured.'); }
  };
  G.fieldItems = function* (u) {
    while (true) {
      if (!u.items.length) { yield G.say(u.name + ' has no items.'); return; }
      const w = yield G.itemList(u, { title: u.name }); if (w.result < 0) return;
      const idx = w.result, it = D().items[u.items[idx].id];
      const c = yield G.cross({ up: { label: 'Use', icon: 'use', disabled: it.type !== 'use' }, left: { label: 'Give', icon: 'give' }, right: { label: 'Equip', icon: 'equip', disabled: !S().canEquip(u, u.items[idx].id) }, down: { label: 'Drop', icon: 'drop', disabled: it.type === 'key' } }, { x: G.W / 2 - 40, y: G.H / 2 + 20 });
      if (!c.result) continue;
      if (c.result === 'up') {
        if (it.effect === 'recall') { yield G.say('Return to the last church visited?'); const k = yield G.confirm(); if (k.result !== 0) continue; u.items.splice(idx, 1); G.audio.sfx('warp'); G.fx.flash = 20; yield 30; G.recallToChurch(); return; }
        const t = yield G.memberPick({ title: 'Use on', filter: x => !x.dead }); if (!t.result) continue;
        const x = t.result; u.items.splice(idx, 1);
        if (it.effect === 'heal') { const a = Math.min(x.mhp - x.hp, it.power); x.hp += a; G.audio.sfx('heal'); yield G.say(x.name + ' recovers ' + a + ' HP.'); }
        else if (it.effect === 'mp') { const a = Math.min(x.mmp - x.mp, it.power); x.mp += a; G.audio.sfx('heal'); yield G.say(x.name + ' recovers ' + a + ' MP.'); }
        else if (it.effect === 'cure') { x.status = {}; G.audio.sfx('heal'); yield G.say(x.name + ' is cured.'); }
        else if (it.effect === 'stat') { const k = it.stat === 'hp' ? 'mhp' : it.stat; x[k] += it.power; if (it.stat === 'hp') x.hp += it.power; G.audio.sfx('buff'); yield G.say(x.name + '\'s ' + it.stat.toUpperCase() + ' rises by ' + it.power + '!'); }
      } else if (c.result === 'left') {
        const t = yield G.memberPick({ title: 'Give to' }); if (!t.result) continue;
        yield* G.giveItemFlow(u, idx, t.result);
      } else if (c.result === 'right') {
        S().equip(u, idx); G.audio.sfx('ok'); yield G.say(u.name + ' equips the ' + it.name + '.');
      } else if (c.result === 'down') {
        yield G.say('Throw away the ' + it.name + '?'); const k = yield G.confirm(); if (k.result === 0) { u.items.splice(idx, 1); G.audio.sfx('cancel'); }
      }
    }
  };

  // ---------- Shop ----------
  // stock: [itemIds], opts: {name, portrait, deals: [itemIds]}
  G.shop = function* (stock, opts = {}) {
    const P = opts.portrait;
    yield G.say(opts.greet || 'Welcome! What can I do for you?', { portrait: P });
    while (true) {
      G.showGold = true;
      const c = yield G.cross({ up: { label: 'Buy', icon: 'item' }, left: { label: 'Sell', icon: 'give' }, right: { label: 'Deals', icon: 'equip', disabled: !(opts.deals && opts.deals.length) }, down: { label: 'Leave', icon: 'quit' } }, { x: G.W / 2 - 40, y: G.H / 2 });
      const op = c.result;
      if (!op || op === 'down') { G.showGold = false; yield G.say(opts.bye || 'Come again!', { portrait: P }); return; }
      if (op === 'up' || op === 'right') {
        const list = op === 'up' ? stock : opts.deals;
        while (true) {
          const items = list.map(id => ({ label: D().items[id].name, right: D().items[id].price + 'G', disabled: D().items[id].price > G.state.gold }));
          const w = yield G.menu(items, { x: 8, y: 8, w: 170, title: 'Buy what?', maxRows: 9, help: i => { const it = D().items[list[i]]; const can = S().active().filter(u => S().canEquip(u, list[i])).map(u => u.name); return it.desc + (it.type === 'weapon' || it.type === 'ring' ? ' Can equip: ' + (can.join(', ') || 'nobody') : ''); } });
          if (w.result < 0) break;
          const id = list[w.result], it = D().items[id];
          const who = yield G.memberPick({ title: 'Who gets the ' + it.name + '?', filter: u => u.items.length < 4 });
          if (!who.result) continue;
          G.state.gold -= it.price; who.result.items.push({ id, eq: false }); G.audio.sfx('coin');
          yield G.say('Thank you!', { portrait: P });
          yield* G.offerEquip(who.result, who.result.items.length - 1);
        }
      } else if (op === 'left') {
        while (true) {
          const who = yield G.memberPick({ title: 'Whose item?', filter: u => u.items.length > 0 }); if (!who.result) break;
          const u = who.result;
          const w = yield G.menu(u.items.map(x => ({ label: G.itemLabel(x), right: Math.floor(D().items[x.id].price * 3 / 4) + 'G', disabled: D().items[x.id].type === 'key' || !D().items[x.id].price })), { x: 8, y: 8, w: 170, title: 'Sell what?' });
          if (w.result < 0) continue;
          const it = D().items[u.items[w.result].id]; const price = Math.floor(it.price * 3 / 4);
          yield G.say('I can give you ' + price + ' gold for the ' + it.name + '. Deal?', { portrait: P });
          const k = yield G.confirm(); if (k.result !== 0) continue;
          u.items.splice(w.result, 1); G.state.gold += price; G.audio.sfx('coin');
        }
      }
    }
  };

  // ---------- Church (Raise / Cure / Promote / Save) ----------
  G.church = function* (npc) {
    const P = npc && npc.portrait;
    G.state.church = { map: G.field.mapId, x: G.field.player.x, y: G.field.player.y + 1 };
    yield G.say('Welcome, children of Aldmere. May the Ember light your path. How may I help you?', { portrait: P });
    while (true) {
      G.showGold = true;
      const c = yield G.cross({ up: { label: 'Raise', icon: 'join' }, left: { label: 'Cure', icon: 'use' }, right: { label: 'Promote', icon: 'equip' }, down: { label: 'Save', icon: 'depot' } }, { x: G.W / 2 - 40, y: G.H / 2 });
      const op = c.result;
      if (!op) { G.showGold = false; yield G.say('Go in peace.', { portrait: P }); return; }
      if (op === 'up') {
        const dead = S().roster().filter(u => u.dead);
        if (!dead.length) { yield G.say('No one needs to be raised. The Ember is kind today.', { portrait: P }); continue; }
        for (const u of dead) {
          const cost = S().reviveCost(u);
          yield G.say(u.name + ' has fallen. Raising them will cost ' + cost + ' gold. Shall I?', { portrait: P });
          const k = yield G.confirm();
          if (k.result === 0) { if (G.state.gold < cost) { yield G.say('Alas, you have not enough gold.', { portrait: P }); continue; } G.state.gold -= cost; S().revive(u); G.audio.sfx('heal'); G.fx.flash = 10; yield G.say('Rise, ' + u.name + '! Breathe again.', { portrait: P }); }
        }
      } else if (op === 'left') {
        const sick = S().roster().filter(u => !u.dead && u.status && u.status.poison);
        if (!sick.length) { yield G.say('No one here is poisoned.', { portrait: P }); continue; }
        for (const u of sick) {
          yield G.say(u.name + ' is poisoned. The cure costs ' + S().cureCost(u) + ' gold. Shall I?', { portrait: P });
          const k = yield G.confirm();
          if (k.result === 0 && G.state.gold >= S().cureCost(u)) { G.state.gold -= S().cureCost(u); u.status = {}; G.audio.sfx('heal'); yield G.say(u.name + ' is cured.', { portrait: P }); }
        }
      } else if (op === 'right') {
        const can = S().roster().filter(u => !u.dead && S().canPromote(u));
        if (!can.length) { yield G.say('No one is ready. A warrior may be promoted from level 20.', { portrait: P }); continue; }
        for (const u of can) {
          const to = D().classes[D().classes[u.cls].promo].name;
          yield G.say(u.name + ' may become a ' + to + '. Their level returns to 1, but their strength remains. Promote?', { portrait: P });
          const k = yield G.confirm();
          if (k.result === 0) { S().promote(u); G.audio.jingle('promote'); G.fx.flash = 16; yield G.say(u.name + ' is now a ' + to + '!', { portrait: P }); }
        }
      } else if (op === 'down') {
        yield G.say('Shall I record your journey in the book of deeds?', { portrait: P });
        const k = yield G.confirm();
        if (k.result === 0) { const ok = S().save(1); G.audio.sfx(ok ? 'item' : 'error'); yield G.say(ok ? 'Your deeds are recorded.' : 'The book will not take the ink... (saving is unavailable in this browser)', { portrait: P }); yield G.say('Will you continue your journey?', { portrait: P }); const q = yield G.confirm(); if (q.result === 1) { G.showGold = false; G.toTitle(); return; } }
      }
    }
  };

  // ---------- Caravan / HQ: Join, Depot, Item, Quit ----------
  G.caravan = function* () {
    while (true) {
      const c = yield G.cross({ up: { label: 'Join', icon: 'join' }, left: { label: 'Depot', icon: 'depot' }, right: { label: 'Item', icon: 'item' }, down: { label: 'Quit', icon: 'quit' } }, { x: G.W / 2 - 40, y: G.H / 2 });
      const op = c.result; if (!op || op === 'down') return;
      if (op === 'up') {
        const all = S().roster();
        const reserve = all.filter(u => !G.state.party.includes(u.id));
        if (!reserve.length) { yield G.say('Every member is already in the active force.'); continue; }
        const w = yield G.memberPick({ list: reserve, title: 'Bring in' }); if (!w.result) continue;
        if (G.state.party.length >= 12) {
          const out = yield G.memberPick({ list: S().active().filter(u => u.id !== 'rowan'), title: 'Swap out' }); if (!out.result) continue;
          G.state.party[G.state.party.indexOf(out.result.id)] = w.result.id;
        } else G.state.party.push(w.result.id);
        G.audio.sfx('ok');
      } else if (op === 'left') {
        const d = yield G.cross({ up: { label: 'Look', icon: 'search' }, left: { label: 'Deposit', icon: 'give' }, right: { label: 'Withdraw', icon: 'item' }, down: { label: 'Quit', icon: 'quit' } }, { x: G.W / 2 - 40, y: G.H / 2 });
        if (d.result === 'up') { if (!G.state.depot.length) yield G.say('The depot is empty.'); else yield G.menu(G.state.depot.map(id => D().items[id].name), { title: 'Depot', maxRows: 10 }); }
        else if (d.result === 'left') {
          const m = yield G.memberPick({ title: 'Whose item?', filter: u => u.items.length > 0 }); if (!m.result) continue;
          const w = yield G.itemList(m.result); if (w.result < 0) continue;
          const it = m.result.items.splice(w.result, 1)[0]; G.state.depot.push(it.id); G.audio.sfx('ok');
        } else if (d.result === 'right') {
          if (!G.state.depot.length) { yield G.say('The depot is empty.'); continue; }
          const w = yield G.menu(G.state.depot.map(id => D().items[id].name), { title: 'Withdraw', maxRows: 10 }); if (w.result < 0) continue;
          const m = yield G.memberPick({ title: 'Give to', filter: u => u.items.length < 4 }); if (!m.result) continue;
          const id = G.state.depot.splice(w.result, 1)[0]; m.result.items.push({ id, eq: false }); G.audio.sfx('item');
          yield* G.offerEquip(m.result, m.result.items.length - 1);
        }
      } else if (op === 'right') {
        const m = yield G.memberPick({ title: 'Whose items?' }); if (!m.result) continue;
        yield* G.fieldItems(m.result);
      }
    }
  };
})();

</script>
<script>/* src/battlescene.js */
// ===== Side-view battle cutscene: plays one action (attack / spell / item) and applies results =====
'use strict';
(function () {
  const D = () => G.data, R = () => G.rules;

  // action: {actor, targets:[unit], kind:'attack'|'spell'|'item', spell, lvl, itemIdx, bg}
  // env: {tileOf(u), dist(a,b), onKill(u,killer)}
  class BattleScene {
    constructor(action, env, w) {
      this.a = action; this.env = env; this.w = w; this.t = 0;
      this.tasks = new G.Tasks();
      this.msgLines = []; this.msgShown = 0; this.msgWait = null;
      this.left = null; this.right = null; // {u, pose, x, y, alpha, flash, off}
      this.fxList = [];
      this.exp = 0; this.gold = 0; this.expCap = 49; this.killed = [];
      this.bgKey = action.bg || 'grass';
      this.slide = 1;
      this.tasks.add(this.run());
    }
    // ---------- message box ----------
    msg(text, hold = 30) {
      this.msgLines.push(text); if (this.msgLines.length > 3) this.msgLines.shift();
      this.msgChars = 0; this.msgTarget = text.length; this.msgHold = hold;
      const self = this; return { done: () => self.msgChars >= self.msgTarget && --self.msgHold <= 0 };
    }
    clearMsg() { this.msgLines = []; }
    // ---------- actors ----------
    specOf(u) { return u.enemy ? u.kind.map : D().chars[u.id].map; }
    actor(u, side) {
      return { u, side, pose: 'idle', x: side === 'left' ? 44 : 180, y: 98, off: 0, alpha: 1, flash: 0, shake: 0,
        facing: side === 'left' ? 'right' : 'left', hpShown: u.hp, mpShown: u.mp };
    }
    sideOf(u) { return u.enemy ? 'left' : 'right'; }
    setupPair(actor, target) {
      // enemies on left facing right, allies on right facing left. Two allies (healing): target on left facing right.
      if (actor.enemy === target.enemy) {
        if (actor === target) { this.right = actor.enemy ? null : this.actor(actor, 'right'); this.left = actor.enemy ? this.actor(actor, 'left') : null; }
        else if (actor.enemy) { this.left = this.actor(actor, 'left'); this.right = this.actor(target, 'right'); this.right.facing = 'left'; }
        else { this.right = this.actor(actor, 'right'); this.left = this.actor(target, 'left'); }
      } else {
        this.left = this.actor(actor.enemy ? actor : target, 'left');
        this.right = this.actor(actor.enemy ? target : actor, 'right');
      }
    }
    view(u) { if (this.left && this.left.u === u) return this.left; if (this.right && this.right.u === u) return this.right; return null; }
    showTarget(target, actor) {
      // swap the non-actor slot to a new target
      const av = this.view(actor);
      const side = av && av.side === 'left' ? 'right' : 'left';
      const v = this.actor(target, side); if (side === 'left') v.facing = 'right';
      if (side === 'left') this.left = v; else this.right = v;
      return v;
    }
    *wait(n) { yield n; }
    // ---------- main flow ----------
    *run() {
      const a = this.a, actor = a.actor;
      const first = a.targets[0];
      this.setupPair(actor, first);
      this.startExp = actor.exp;
      G.audio.sfx('select');
      // slide in
      for (let i = 0; i <= 12; i++) { this.slide = 1 - i / 12; yield 1; }
      this.slide = 0;
      if (a.kind === 'attack') yield* this.doAttack(actor, first, false);
      else if (a.kind === 'spell') yield* this.doSpell(actor, a.spell, a.lvl, a.targets, false);
      else if (a.kind === 'item') yield* this.doItem(actor, a.itemIdx, a.targets[0]);
      // EXP & gold (allies only)
      if (!actor.enemy && actor.hp > 0 && this.exp > 0) {
        const gained = R().finalizeExp(Math.min(this.exp, this.expCap));
        yield this.msg(actor.name + ' gains ' + gained + ' EXP.', 40);
        actor.exp += gained;
        while (actor.exp >= 100 && actor.lv < R().maxLevel(actor)) {
          actor.exp -= 100;
          const lu = R().levelUp(actor);
          G.audio.jingle('levelup');
          yield this.msg(actor.name + ' is now level ' + actor.lv + '!', 50);
          const names = { hp: 'HP', mp: 'MP', att: 'ATT', def: 'DEF', agi: 'AGI' };
          const parts = [];
          for (const k of ['att', 'def', 'agi', 'hp', 'mp']) if (lu.gains[k] > 0) parts.push(names[k] + ' +' + lu.gains[k]);
          for (let i = 0; i < parts.length; i += 3) yield this.msg(parts.slice(i, i + 3).join('  '), 36);
          for (const l of lu.learned) yield this.msg('Learned ' + D().spells[l.id].name + ' ' + l.lv + '!', 44);
          const v = this.view(actor); if (v) { v.hpShown = actor.hp; v.mpShown = actor.mp; }
        }
      }
      if (this.gold > 0) { G.state.gold += this.gold; G.audio.sfx('coin'); yield this.msg('Found ' + this.gold + ' gold coins.', 40); }
      if (this.drops && this.drops.length) {
        for (const id of this.drops) { const who = G.st.giveItem(id); G.audio.sfx('item'); yield this.msg((who ? who.name + ' picks up ' : 'Sent to the depot: ') + D().items[id].name + '.', 44); }
      }
      yield 20;
      for (let i = 0; i <= 10; i++) { this.fadeOut = i / 10; yield 1; }
      G.pop(); this.w.resolve({ killed: this.killed });
    }

    // physical attack sequence including double/counter
    *doAttack(att, tgt, isCounter) {
      const av = this.view(att), tv = this.view(tgt);
      const ranged = this.env.dist(att, tgt) > 1 || (R().range(att)[0] > 1);
      if (isCounter) yield this.msg(att.name + ' counterattacks!', 16);
      else yield this.msg(att.name + ' attacks!', 12);
      // wind up
      av.pose = 'ready'; G.audio.sfx(ranged ? 'swing' : 'swing'); yield 14;
      const res = R().rollAttack(att, tgt, this.env.tileOf(tgt), isCounter);
      if (ranged) {
        av.pose = 'attack'; G.audio.sfx('arrow');
        yield* this.projectile(av, tv, this.projKind(att));
      } else {
        // lunge
        for (let i = 1; i <= 6; i++) { av.off = (av.side === 'left' ? 1 : -1) * i * 7; if (i === 3) av.pose = 'attack'; yield 1; }
      }
      if (res.dodge) {
        G.audio.sfx('miss');
        for (let i = 1; i <= 6; i++) { tv.off = (tv.side === 'left' ? -1 : 1) * i * 4; yield 1; }
        yield this.msg(tgt.name + ' dodges!', 24);
        for (let i = 5; i >= 0; i--) { tv.off = (tv.side === 'left' ? -1 : 1) * i * 4; yield 1; }
      } else {
        yield* this.hit(att, tgt, res.dmg, res.crit, res.poison);
      }
      // return to place
      for (let i = 5; i >= 0; i--) { av.off = (av.side === 'left' ? 1 : -1) * i * 7; yield 1; }
      av.pose = 'idle';
      if (tgt.hp <= 0 || att.hp <= 0 || isCounter) return;
      // double attack, then counter (target's prowess)
      const p = R().prowess(att), q = R().prowess(tgt);
      const dbl = G.chance(p.dbl);
      const ctr = G.chance(q.ctr);
      if (dbl) {
        yield this.msg(att.name + ' strikes again!', 12);
        av.pose = 'ready'; yield 10;
        const r2 = R().rollAttack(att, tgt, this.env.tileOf(tgt), false);
        if (ranged) { av.pose = 'attack'; G.audio.sfx('arrow'); yield* this.projectile(av, tv, this.projKind(att)); }
        else for (let i = 1; i <= 6; i++) { av.off = (av.side === 'left' ? 1 : -1) * i * 7; if (i === 3) av.pose = 'attack'; yield 1; }
        if (r2.dodge) { G.audio.sfx('miss'); yield this.msg(tgt.name + ' dodges!', 24); }
        else yield* this.hit(att, tgt, r2.dmg, r2.crit, r2.poison);
        for (let i = 5; i >= 0; i--) { av.off = (av.side === 'left' ? 1 : -1) * i * 7; yield 1; }
        av.pose = 'idle';
        if (tgt.hp <= 0) return;
      }
      if (ctr && !(tgt.status.sleep || tgt.status.stun)) {
        const rg = R().range(tgt), d = this.env.dist(att, tgt);
        if (d >= rg[0] && d <= rg[1]) yield* this.doAttack(tgt, att, true);
      }
    }
    projKind(u) {
      const w = u.enemy ? u.kind.map.weapon : D().chars[u.id].map.weapon;
      return w === 'bow' ? 'arrow' : w === 'spear' || w === 'lance' ? 'javelin' : 'rock';
    }
    *projectile(from, to, kind) {
      const tip = G.weaponTip(this.specOf(from.u), 'attack', from.facing);
      const sx = from.x + from.off + tip.x, sy = from.y + tip.y;
      const ex = to.x + 48, ey = to.y + 58;
      const p = { kind, x: sx, y: sy, dir: ex > sx ? 1 : -1, life: 999 };
      this.fxList.push(p);
      const n = 12;
      for (let i = 1; i <= n; i++) { p.x = sx + (ex - sx) * i / n; p.y = sy + (ey - sy) * i / n - Math.sin(i / n * Math.PI) * 10; yield 1; }
      p.life = 0;
    }
    *hit(att, tgt, dmg, crit, poison) {
      const tv = this.view(tgt);
      if (crit) {
        G.fx.flash = 6; G.fx.flashColor = '#fff'; G.fx.shake = 14; G.audio.sfx('crit');
        yield this.msg(att.enemy ? 'A savage blow!' : 'Critical hit!', 8);
      } else { G.audio.sfx('hit'); G.fx.shake = 6; }
      tv.pose = 'hurt'; tv.flash = 10;
      this.spark(tv);
      tgt.hp = Math.max(0, tgt.hp - dmg);
      if (!att.enemy) this.addDamageExp(att, tgt, dmg);
      if (poison && tgt.hp > 0) { tgt.status.poison = true; }
      yield* this.animHP(tv);
      yield this.msg(tgt.name + ' takes ' + dmg + ' damage.', 20);
      if (poison && tgt.hp > 0) { G.audio.sfx('debuff'); yield this.msg(tgt.name + ' is poisoned!', 24); }
      tv.pose = 'idle';
      if (tgt.hp <= 0) yield* this.die(tgt, att);
    }
    addDamageExp(att, tgt, dmg) {
      if (tgt.enemy === att.enemy) return;
      const k = R().killExp(att, tgt);
      this.exp += Math.floor(k * Math.min(dmg, tgt.mhp) / Math.max(1, tgt.mhp));
      if (this.exp > 49) this.exp = 49;
    }
    *die(u, killer) {
      const v = this.view(u);
      G.audio.sfx('die');
      for (let i = 0; i < 24; i++) { v.flash = i % 4 < 2 ? 2 : 0; v.alpha = 1 - i / 24; yield 1; }
      v.alpha = 0;
      if (u.enemy) {
        yield this.msg(u.name + ' is defeated!', 24);
        if (killer && !killer.enemy) {
          this.exp += R().killExp(killer, u); if (this.exp > 49) this.exp = 49; killer.kills = (killer.kills || 0) + 1;
          this.gold += u.kind.gold || 0;
          if (u.drop && G.r(100) < (u.drop.chance || 100)) { (this.drops = this.drops || []).push(u.drop.item); }
        }
      } else {
        yield this.msg(u.name + ' has fallen!', 30);
      }
      this.killed.push(u);
      this.env.onKill && this.env.onKill(u, killer);
    }
    *animHP(v) {
      const u = v.u;
      for (let i = 0; i < 40 && (Math.round(v.hpShown) !== u.hp); i++) {
        const d = u.hp - v.hpShown; v.hpShown += Math.sign(d) * Math.max(0.5, Math.abs(d) / 6); yield 1;
        if (Math.abs(u.hp - v.hpShown) < 0.6) v.hpShown = u.hp;
      }
      v.hpShown = u.hp;
    }
    spark(v) { for (let i = 0; i < 10; i++) this.fxList.push({ kind: 'spark', x: v.x + 48 + G.r(20) - 10, y: v.y + 50 + G.r(20) - 10, vx: (G.rand() - 0.5) * 4, vy: (G.rand() - 0.9) * 3, life: 16 + G.r(8) }); }

    // ---------- spells ----------
    *doSpell(caster, spellId, lvl, targets) {
      const sp = D().spells[spellId], L = sp.levels[lvl - 1];
      const cv = this.view(caster);
      caster.mp = Math.max(0, caster.mp - L.mp);
      cv.pose = 'cast';
      yield this.msg(caster.name + ' casts ' + sp.name + (sp.levels.length > 1 ? ' ' + lvl : '') + '!', 10);
      G.audio.sfx('select');
      for (let i = 0; i < 20; i++) { if (i % 3 === 0) this.fxList.push({ kind: 'glow', x: cv.x + 48 + (G.rand() - 0.5) * 30, y: cv.y + 40 + (G.rand() - 0.5) * 30, life: 20, col: this.spellColor(sp) }); yield 1; }
      if (sp.kind === 'recall') {
        G.audio.sfx('warp'); G.fx.flash = 20; G.fx.flashColor = '#fff';
        yield this.msg('A bright light surrounds the force...', 30);
        this.recall = true; cv.pose = 'idle'; return;
      }
      if (sp.kind === 'healers' || sp.kind === 'heal') this.expCap = 25;
      for (let ti = 0; ti < targets.length; ti++) {
        const tgt = targets[ti];
        if (tgt.hp <= 0) continue;
        let tv = this.view(tgt);
        if (!tv || (tgt === caster && sp.kind !== 'heal' && sp.kind !== 'buff' && sp.kind !== 'cure')) tv = this.showTarget(tgt, caster);
        if (!tv) tv = this.showTarget(tgt, caster);
        if (ti > 0) yield 8;
        yield* this.spellFx(sp, tv);
        if (sp.kind === 'damage') {
          const r = R().spellPower(caster, spellId, lvl, tgt);
          if (r.crit) { G.fx.shake = 10; yield this.msg('A surge of power!', 8); }
          tv.pose = 'hurt'; tv.flash = 10;
          tgt.hp = Math.max(0, tgt.hp - r.dmg);
          if (!caster.enemy) this.addDamageExp(caster, tgt, r.dmg);
          yield* this.animHP(tv);
          yield this.msg(tgt.name + ' takes ' + r.dmg + ' damage.', 20);
          tv.pose = 'idle';
          if (tgt.hp <= 0) yield* this.die(tgt, caster);
        } else if (sp.kind === 'heal') {
          const amt = Math.min(tgt.mhp - tgt.hp, R().spellPower(caster, spellId, lvl, tgt).amount);
          tgt.hp += amt; yield* this.animHP(tv);
          yield this.msg(tgt.name + ' recovers ' + amt + ' HP.', 20);
          if (!caster.enemy && R().cls(caster).healer) { this.exp += Math.max(10, Math.floor(25 * amt / tgt.mhp)); if (this.exp > 25) this.exp = 25; }
        } else if (sp.kind === 'cure') {
          const had = tgt.status.poison || tgt.status.sleep || tgt.status.muddle;
          tgt.status.poison = false; tgt.status.sleep = false; tgt.status.muddle = false;
          yield this.msg(had ? tgt.name + ' is cured.' : 'Nothing happens.', 24);
          if (!caster.enemy && had) { this.exp += 10; if (this.exp > 25) this.exp = 25; }
        } else if (sp.kind === 'buff') {
          tgt.status.quick = 3; tgt.status.quickPow = L.power;
          yield this.msg(tgt.name + ' feels lighter! AGI & DEF up.', 24);
          if (!caster.enemy) { this.exp += 5; }
        } else if (sp.kind === 'debuff') {
          if (G.chance(4) && tgt.kind.boss) { yield this.msg(tgt.name + ' resists!', 24); continue; }
          tgt.status.sap = 3; tgt.status.sapPow = L.power;
          yield this.msg(tgt.name + ' is sapped! AGI & DEF down.', 24);
          if (!caster.enemy) { this.exp += 5; }
        } else if (sp.kind === 'poison') {
          if (G.chance(3)) { yield this.msg(tgt.name + ' resists!', 24); continue; }
          tgt.status.poison = true; yield this.msg(tgt.name + ' is poisoned!', 24);

    spellColor(sp) { return { fire: '#ff8020', ice: '#a0e0ff', dark: '#b060ff' }[sp.elem] || (sp.kind === 'heal' || sp.kind === 'cure' ? '#80ffa0' : sp.kind === 'debuff' || sp.kind === 'poison' ? '#c040c0' : '#ffffa0'); }
    *spellFx(sp, tv) {
      const cx = tv.x + 48, cy = tv.y + 60;

        if (sp.elem === 'fire') { for (let k = 0; k < 3; k++) this.fxList.push({ kind: 'flame', x: cx + (G.rand() - 0.5) * 50, y: cy + 20, vy: -1.5 - G.rand() * 2, vx: (G.rand() - 0.5), life: 20 + G.r(10) }); }
        else if (sp.elem === 'ice') { if (i % 2 === 0) this.fxList.push({ kind: 'shard', x: cx + (G.rand() - 0.5) * 60, y: cy - 60, vy: 4 + G.rand() * 2, vx: (G.rand() - 0.5), life: 18 }); }
        else if (sp.elem === 'dark') { if (i % 2 === 0) this.fxList.push({ kind: 'orb', x: cx + Math.cos(i / 3) * 30, y: cy + Math.sin(i / 3) * 20 - 10, vx: -Math.cos(i / 3) * 1.5, vy: -Math.sin(i / 3), life: 20, col }); if (i === 28) { G.fx.flash = 4; G.fx.flashColor = '#b060ff'; } }
        else if (sp.kind === 'heal' || sp.kind === 'cure' || sp.kind === 'buff') { if (i % 2 === 0) this.fxList.push({ kind: 'sparkle', x: cx + (G.rand() - 0.5) * 40, y: cy + 20, vy: -1.2 - G.rand(), vx: 0, life: 30, col }); }

    }

    // ---------- items ----------
    *doItem(user, idx, tgt) {
      const itId = user.items[idx].id, it = D().items[itId];
      const uv = this.view(user);
      yield this.msg(user.name + ' uses ' + it.name + '.', 16);
      let tv = this.view(tgt) || this.showTarget(tgt, user);
      user.items.splice(idx, 1);
      if (it.effect === 'heal') {
        yield* this.spellFx({ kind: 'heal', sfx: 'heal' }, tv);
        const amt = Math.min(tgt.mhp - tgt.hp, it.power); tgt.hp += amt; yield* this.animHP(tv);
        yield this.msg(tgt.name + ' recovers ' + amt + ' HP.', 24);
      } else if (it.effect === 'mp') {
        yield* this.spellFx({ kind: 'heal', sfx: 'heal' }, tv);
        const amt = Math.min(tgt.mmp - tgt.mp, it.power); tgt.mp += amt; tv.mpShown = tgt.mp;
        yield this.msg(tgt.name + ' recovers ' + amt + ' MP.', 24);
      } else if (it.effect === 'cure') {
        yield* this.spellFx({ kind: 'cure', sfx: 'heal' }, tv);
        tgt.status.poison = false; yield this.msg(tgt.name + ' is cured.', 24);
      } else if (it.effect === 'recall') {
        G.audio.sfx('warp'); G.fx.flash = 20; this.recall = true;
        yield this.msg('A bright light surrounds the force...', 30);
      } else if (it.effect === 'stat') {
        yield* this.spellFx({ kind: 'buff', sfx: 'buff' }, tv);
        const k = it.stat === 'hp' ? 'mhp' : it.stat; tgt[k] += it.power; if (it.stat === 'hp') tgt.hp += it.power;
        yield this.msg(tgt.name + '\'s ' + it.stat.toUpperCase() + ' rises by ' + it.power + '!', 30);
      }
    }

    // ---------- loop ----------
    update() {
      this.t++;
      this.tasks.update();
      if (this.msgChars < this.msgTarget) this.msgChars += (G.input.h('A') ? 4 : 2);
      // speed up by holding A
      if (G.input.h('A') && this.tasks.busy && this.t % 2 === 0) this.tasks.update();
      [this.left, this.right].forEach(v => { if (v && v.flash > 0) v.flash--; });
      this.fxList.forEach(p => { if (p.vx) p.x += p.vx; if (p.vy) p.y += p.vy; if (p.kind === 'spark') p.vy += 0.25; p.life--; });
      this.fxList = this.fxList.filter(p => p.life > 0);
    }
    drawUnit(ctx, v) {
      if (!v || v.alpha <= 0) return;
      const spec = this.specOf(v.u);
      const img = G.battleSprite(spec, v.pose, v.facing);
      const slideX = (v.side === 'left' ? -1 : 1) * this.slide * 180;
      const bob = v.pose === 'idle' ? Math.round(Math.sin((this.t + (v.side === 'left' ? 20 : 0)) / 18)) : 0;

      ctx.fillStyle = 'rgba(0,0,0,0.3)'; ctx.beginPath(); ctx.ellipse(x + 48, v.y + 91, 26, 5, 0, 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = v.alpha;
      ctx.drawImage(img, x, y);
      if (v.flash > 0 && v.flash % 4 < 2) ctx.drawImage(G.tinted(img, '#ffffff', JSON.stringify(spec) + v.pose + v.facing), x, y);
      ctx.globalAlpha = 1;
    }
    drawStatus(ctx, v, x) {
      if (!v) return;
      const u = v.u;
      G.win(ctx, x, 4, 120, u.mmp > 0 ? 40 : 30);
      G.text(ctx, u.name, x + 8, 9, u.enemy ? '#ff9090' : '#fff');
      if (!u.enemy) G.textR(ctx, 'L' + u.lv, x + 112, 9, '#f8e060');
      G.text(ctx, 'HP', x + 8, 20, '#a0c0ff');
      G.bar(ctx, x + 22, 21, 56, v.hpShown, u.mhp, v.hpShown / u.mhp < 0.3 ? '#f06040' : '#f8d030');
      G.textR(ctx, Math.round(v.hpShown) + '/' + u.mhp, x + 114, 20);
      if (u.mmp > 0) { G.text(ctx, 'MP', x + 8, 30, '#a0c0ff'); G.bar(ctx, x + 22, 31, 56, u.mp, u.mmp, '#60a0ff'); G.textR(ctx, u.mp + '/' + u.mmp, x + 114, 30); }
    }
    draw(ctx) {
      G.drawBattleBG(ctx, this.bgKey, this.t);
      this.drawUnit(ctx, this.left); this.drawUnit(ctx, this.right);
      // effects
      this.fxList.forEach(p => {
        if (p.kind === 'arrow' || p.kind === 'javelin') {
          ctx.fillStyle = '#6a4020'; const len = p.kind === 'arrow' ? 12 : 18;
          ctx.fillRect(Math.round(p.x - (p.dir > 0 ? len : 0)), Math.round(p.y), len, 1);
          ctx.fillStyle = '#e0e0f0'; ctx.fillRect(Math.round(p.x + (p.dir > 0 ? 0 : -2)), Math.round(p.y) - 1, 3, 3);
          ctx.fillStyle = '#f0f0f0'; ctx.fillRect(Math.round(p.x - (p.dir > 0 ? len : -len + 2)), Math.round(p.y) - 1, 2, 3);
        } else if (p.kind === 'rock') { ctx.fillStyle = '#c0c0c0'; ctx.fillRect(p.x - 2, p.y - 2, 4, 4); }
        else if (p.kind === 'spark') { ctx.fillStyle = p.life % 4 < 2 ? '#fff8c0' : '#ffb040'; ctx.fillRect(Math.round(p.x), Math.round(p.y), 2, 2); }
        else if (p.kind === 'flame') {
          const s = Math.max(1, Math.round(p.life / 6)); ctx.fillStyle = p.life > 18 ? '#fff0a0' : p.life > 10 ? '#ff9020' : '#c02010';
          ctx.fillRect(Math.round(p.x - s), Math.round(p.y - s), s * 2, s * 2 + 1);
        } else if (p.kind === 'shard') { ctx.fillStyle = '#e0f8ff'; ctx.fillRect(Math.round(p.x), Math.round(p.y), 2, 6); ctx.fillStyle = '#80c0ff'; ctx.fillRect(Math.round(p.x) + 1, Math.round(p.y) + 1, 1, 4); }
        else if (p.kind === 'orb' || p.kind === 'glow' || p.kind === 'sparkle') {
          ctx.globalAlpha = Math.min(1, p.life / 10); ctx.fillStyle = p.col || '#fff';
          const s = p.kind === 'orb' ? 3 : 2; ctx.fillRect(Math.round(p.x) - s / 2, Math.round(p.y) - s / 2, s, s);
          if (p.kind === 'sparkle' && p.life % 6 < 3) { ctx.fillRect(Math.round(p.x) - 3, Math.round(p.y), 7, 1); ctx.fillRect(Math.round(p.x), Math.round(p.y) - 3, 1, 7); }

      });
      if (this.slide < 1) { this.drawStatus(ctx, this.left, 6); this.drawStatus(ctx, this.right, G.W - 126); }
      // message box
      if (this.msgLines.length) {
        G.win(ctx, 8, G.H - 48, G.W - 16, 44);
        const n = this.msgLines.length;
        this.msgLines.forEach((l, i) => {
          const s = i === n - 1 ? l.slice(0, this.msgChars) : l;
          G.text(ctx, s, 18, G.H - 42 + i * 12);
        });
      }

    }
  }
  G.playAction = function (action, env) { const w = new G.Wait(); const s = new BattleScene(action, env, w); w.scene = s; G.push(s); return w; };
})();

<script>/* src/battle.js */
// ===== Tactical battle map: turn loop, movement, menus, targeting, enemy AI =====
'use strict';
(function () {
  const D = () => G.data, R = () => G.rules, T = () => G.TILE;
  const key = (x, y) => x + ',' + y;
  const DIR4 = [[0, -1, 'up'], [0, 1, 'down'], [-1, 0, 'left'], [1, 0, 'right']];

  class Battle {
    constructor(id, opts = {}) {
      this.id = id; this.def = G.battles[id]; this.opts = opts;
      const rows = this.def.map;
      this.map = { w: Math.max(...rows.map(r => r.length)), h: rows.length, rows, get(x, y) { if (y < 0 || y >= this.h || x < 0 || x >= this.w) return ' '; return this.rows[y][x] || ' '; } };
      this.units = []; this.t = 0; this.tasks = new G.Tasks();
      this.cam = { x: 0, y: 0 }; this.camT = { x: 0, y: 0 };
      this.cursor = null; this.overlay = null; this.overlayColor = null; this.area = null;
      this.active = null; this.hud = true; this.result = null; this.round = 0;
      this.setup();
      this.tasks.add(this.main());
    }
    // ---------- setup ----------
    setup() {
      const party = G.st.active().filter(u => !u.dead);
      const pts = this.def.allies;
      party.slice(0, pts.length).forEach((u, i) => {
        u.x = pts[i][0]; u.y = pts[i][1]; u.dir = this.def.allyDir || 'up'; u.side = 'ally'; u.ox = 0; u.oy = 0; u.gone = false; u.status = u.status || {};
        this.units.push(u);
      });
      this.def.enemies.forEach((e, i) => {
        const k = D().enemies[e.t];
        const lvBoost = e.lv ? e.lv - k.lv : 0;
        const u = {
          enemy: true, kind: k, name: e.name || k.name, lv: e.lv || k.lv, uid: 'e' + i,
          mhp: k.hp + lvBoost * 2, mmp: k.mp, att: k.att + lvBoost, def: k.def + Math.floor(lvBoost / 2), agi: k.agi + Math.floor(lvBoost / 2),
          x: e.x, y: e.y, dir: e.dir || 'down', side: 'enemy', ox: 0, oy: 0, status: {}, ai: e.ai || k.ai || 'aggressive', awake: e.ai !== 'wait' && k.ai !== 'wait',
          drop: e.drop || null, hidden: !!e.hidden, boss: !!e.boss || !!k.boss, tag: e.tag, trigger: e.trigger
        };
        u.hp = u.mhp; u.mp = u.mmp;
        this.units.push(u);
      });
      const L = G.st.leader();
      this.centerOn(L.x, L.y, true);
    }
    env() {
      return {
        tileOf: u => this.map.get(u.x, u.y),
        dist: (a, b) => Math.abs(a.x - b.x) + Math.abs(a.y - b.y),
        onKill: (u) => { u.gone = true; if (!u.enemy) { u.dead = true; u.defeats = (u.defeats || 0) + 1; } }
      };
    }
    alive(side) { return this.units.filter(u => !u.gone && u.hp > 0 && !u.hidden && (!side || u.side === side)); }
    unitAt(x, y) { return this.units.find(u => !u.gone && u.hp > 0 && !u.hidden && u.x === x && u.y === y); }
    dist(a, b) { return Math.abs(a.x - b.x) + Math.abs(a.y - b.y); }

    // ---------- pathing ----------
    // Dijkstra over movement points. Opposing units block; friendly units can be passed through.
    reach(u, mov = R().mov(u), fromX = u.x, fromY = u.y) {
      const best = new Map(), prev = new Map();
      best.set(key(fromX, fromY), 0);
      const open = [[0, fromX, fromY]];
      while (open.length) {
        open.sort((a, b) => a[0] - b[0]);
        const [c, x, y] = open.shift();
        if (c > best.get(key(x, y))) continue;
        for (const [dx, dy] of DIR4) {
          const nx = x + dx, ny = y + dy;
          if (nx < 0 || ny < 0 || nx >= this.map.w || ny >= this.map.h) continue;
          const cost = R().moveCost(u, this.map.get(nx, ny)); if (!isFinite(cost)) continue;
          const o = this.unitAt(nx, ny); if (o && o.side !== u.side) continue;
          const nc = c + cost; if (nc > mov + 1e-9) continue;
          const k = key(nx, ny);
          if (!best.has(k) || nc < best.get(k)) { best.set(k, nc); prev.set(k, key(x, y)); open.push([nc, nx, ny]); }
        }
      }
      // remove tiles occupied by others (can pass, can't stop)
      const stop = new Set();
      for (const k of best.keys()) { const [x, y] = k.split(',').map(Number); const o = this.unitAt(x, y); if (!o || o === u) stop.add(k); }
      return { cost: best, prev, stop };
    }
    pathTo(r, x, y) { const out = []; let k = key(x, y); while (k) { out.unshift(k.split(',').map(Number)); k = r.prev.get(k); } return out; }
    tilesInRange(x, y, rg) {
      const out = [];
      for (let dy = -rg[1]; dy <= rg[1]; dy++) for (let dx = -rg[1]; dx <= rg[1]; dx++) {
        const d = Math.abs(dx) + Math.abs(dy); if (d < rg[0] || d > rg[1]) continue;
        const nx = x + dx, ny = y + dy; if (nx < 0 || ny < 0 || nx >= this.map.w || ny >= this.map.h) continue; out.push([nx, ny]);
      }
      return out;
    }
    areaTiles(x, y, r) { return this.tilesInRange(x, y, [0, r]); }
    targetsInRange(u, rg, side, x = u.x, y = u.y) {
      return this.tilesInRange(x, y, rg).map(([tx, ty]) => this.unitAt(tx, ty)).filter(o => o && o.side === side);
    }

    // ---------- camera ----------
    centerOn(x, y, snap) {
      const T = G.TILE;
      const mw = this.map.w * T, mh = this.map.h * T;
      let cx = x * T + T / 2 - G.W / 2, cy = y * T + T / 2 - G.H / 2;
      cx = mw <= G.W ? (mw - G.W) / 2 : G.clamp(cx, 0, mw - G.W);
      cy = mh <= G.H ? (mh - G.H) / 2 : G.clamp(cy, 0, mh - G.H);
      this.camT = { x: cx, y: cy }; if (snap) this.cam = { x: cx, y: cy };
    }
    *focus(x, y) { this.centerOn(x, y); for (let i = 0; i < 40; i++) { if (Math.abs(this.cam.x - this.camT.x) < 1 && Math.abs(this.cam.y - this.camT.y) < 1) break; yield 1; } this.cam.x = this.camT.x; this.cam.y = this.camT.y; }

    // ---------- movement animation ----------
    *walk(u, path, speed = 4) {
      for (let i = 1; i < path.length; i++) {
        const [px, py] = path[i - 1], [nx, ny] = path[i];
        const dx = nx - px, dy = ny - py;
        u.dir = dx > 0 ? 'right' : dx < 0 ? 'left' : dy > 0 ? 'down' : 'up';
        const steps = Math.ceil(G.TILE / speed);
        for (let s = 1; s <= steps; s++) { u.ox = -dx * (G.TILE - s * speed); u.oy = -dy * (G.TILE - s * speed); if (s === 1) { u.x = nx; u.y = ny; } this.centerOn(u.x, u.y); yield 1; }
        u.ox = 0; u.oy = 0;
      }
    }

    // ---------- main loop ----------
    *main() {
      G.fade.a = 1; G.audio.play(this.def.music || 'battle');
      yield G.fadeTo(0, 0.05);
      if (this.def.intro) yield* this.def.intro(this);
      while (!this.result) {
        this.round++;
        const order = R().turnOrder(this.units.filter(u => !u.gone && u.hp > 0 && !u.hidden));
        for (const u of order) {
          if (u.gone || u.hp <= 0 || u.hidden) continue;
          yield* this.startTurn(u);
          if (u.gone || u.hp <= 0) { this.checkEnd(); if (this.result) break; continue; }
          if (u.status.sleep) { u.status.sleep--; yield* this.focus(u.x, u.y); yield G.say(u.name + ' is asleep.', { auto: 40 }); continue; }
          if (u.enemy || G.debugAuto) yield* this.enemyTurn(u); else yield* this.playerTurn(u);
          this.active = null; this.overlay = null; this.cursor = null; this.area = null;
          if (this.def.onAfterTurn) yield* this.def.onAfterTurn(this, u);
          this.checkEnd();
          if (this.result) break;
        }
      }
      yield* this.finish();
    }
    checkEnd() {
      const L = G.st.leader();
      if (this.recall) { this.result = 'recall'; return; }
      if (L.hp <= 0 || L.gone) { this.result = 'lose'; return; }
      if (this.def.win === 'boss') { if (this.units.some(u => u.boss && (u.gone || u.hp <= 0))) this.result = 'win'; }
      if (this.alive('enemy').length === 0 && !this.units.some(u => u.enemy && u.hidden && !u.gone)) this.result = 'win';
    }
    *startTurn(u) {
      // status countdowns
      if (u.status.quick) { u.status.quick--; if (!u.status.quick) delete u.status.quickPow; }
      if (u.status.sap) { u.status.sap--; if (!u.status.sap) delete u.status.sapPow; }
      if (u.status.poison) {
        yield* this.focus(u.x, u.y);
        const dmg = Math.max(1, Math.floor(u.mhp / 10));
        u.hp = Math.max(0, u.hp - dmg); G.audio.sfx('debuff'); this.flashUnit = { u, t: 16 };

          left: { label: 'Magic', icon: 'magic', disabled: spells.length === 0 },

    *doAttackCmd(u, targets) {

    }

    *runAction(action) {
      action.bg = R().terrain(this.map.get((action.actor.enemy ? action.targets[0] : action.actor).x, (action.actor.enemy ? action.targets[0] : action.actor).y)).bg;
      if (action.actor.enemy === action.targets[0].enemy && action.actor.enemy) action.bg = R().terrain(this.map.get(action.actor.x, action.actor.y)).bg;

      const w = G.playAction(action, this.env());

      yield w;

      G.fade.a = 1;
      yield G.fadeTo(0, 0.15);

      if (this.def.onKill) for (const k of (w.result.killed || [])) yield* this.def.onKill(this, k);
    }

    // target cycling among a list of units
    *pickTarget(u, targets, rg, mode) {
      if (!targets.length) return null;
      this.overlay = new Set(this.tilesInRange(u.x, u.y, rg).map(([x, y]) => key(x, y)));
      this.overlayColor = mode === 'attack' ? 'attack' : 'heal';
      targets.sort((a, b) => (a.y - b.y) || (a.x - b.x));
      let i = 0;
      this.cursor = { x: targets[0].x, y: targets[0].y }; this.infoTarget = targets[0];
      while (true) {
        yield 1;
        const d = G.input.repDir(14, 8);
        if (d) { i = (i + (d === 'up' || d === 'left' ? -1 : 1) + targets.length) % targets.length; G.audio.sfx('cursor'); }
        const t = targets[i]; this.cursor = { x: t.x, y: t.y }; this.infoTarget = t; this.centerOn(t.x, t.y);
        if (u.x !== t.x || u.y !== t.y) u.dir = Math.abs(t.x - u.x) > Math.abs(t.y - u.y) ? (t.x > u.x ? 'right' : 'left') : (t.y > u.y ? 'down' : 'up');
        if (G.input.p('A')) { G.audio.sfx('ok'); this.overlay = null; this.cursor = null; this.infoTarget = null; return t; }
        if (G.input.p('B')) { G.audio.sfx('cancel'); this.overlay = null; this.cursor = null; this.infoTarget = null; this.centerOn(u.x, u.y); return null; }
      }
    }
    // free cursor within range with area-of-effect preview
    *pickArea(u, rg, radius, side, sp) {
      const inRange = new Set(this.tilesInRange(u.x, u.y, rg).map(([x, y]) => key(x, y)));
      this.overlay = inRange; this.overlayColor = side === 'enemy' ? 'attack' : 'heal';
      // start on nearest valid unit
      const cands = this.tilesInRange(u.x, u.y, rg).map(([x, y]) => this.unitAt(x, y)).filter(o => o && o.side === side);
      let cx = cands.length ? cands[0].x : u.x, cy = cands.length ? cands[0].y : u.y;
      if (!cands.length) { this.overlay = null; yield G.say('No one is within range.'); return null; }
      while (true) {
        this.cursor = { x: cx, y: cy };
        this.area = new Set(this.areaTiles(cx, cy, radius).map(([x, y]) => key(x, y)));
        const hit = this.areaTiles(cx, cy, radius).map(([x, y]) => this.unitAt(x, y)).filter(o => o && o.side === side);
        this.infoTarget = this.unitAt(cx, cy) || null;
        this.centerOn(cx, cy);
        yield 1;
        const d = G.input.repDir(12, 6);
        if (d) { const [dx, dy] = G.DIRS[d]; if (inRange.has(key(cx + dx, cy + dy))) { cx += dx; cy += dy; G.audio.sfx('cursor'); } }
        if (G.input.p('A')) {
          if (!hit.length) { G.audio.sfx('error'); continue; }
          G.audio.sfx('ok'); this.overlay = null; this.cursor = null; this.area = null; this.infoTarget = null;
          // order: center first
          hit.sort((a, b) => this.dist(a, { x: cx, y: cy }) - this.dist(b, { x: cx, y: cy }));
          return hit;
        }
        if (G.input.p('B')) { G.audio.sfx('cancel'); this.overlay = null; this.cursor = null; this.area = null; this.infoTarget = null; this.centerOn(u.x, u.y); return null; }
      }
    }
    // look around the map (C button); A on a unit shows its move+attack reach
    *lookMode(x, y) {
      const saveO = this.overlay, saveC = this.overlayColor;
      this.overlay = null; this.cursor = { x, y };
      while (true) {
        yield 1;
        const d = G.input.repDir(10, 4);
        if (d) { const [dx, dy] = G.DIRS[d]; this.cursor.x = G.clamp(this.cursor.x + dx, 0, this.map.w - 1); this.cursor.y = G.clamp(this.cursor.y + dy, 0, this.map.h - 1); this.centerOn(this.cursor.x, this.cursor.y); this.overlay = null; }
        this.infoTarget = this.unitAt(this.cursor.x, this.cursor.y) || null;
        if (G.input.p('A') && this.infoTarget) {
          const o = this.infoTarget; const r = this.reach(o);
          const s = new Set(r.stop);
          const rg = R().range(o);
          for (const k of r.stop) { const [ax, ay] = k.split(',').map(Number); this.tilesInRange(ax, ay, rg).forEach(([tx, ty]) => s.add(key(tx, ty))); }
          this.overlay = s; this.overlayColor = o.enemy ? 'attack' : 'move';
          G.audio.sfx('select');
        } else if (G.input.p('A') && !this.infoTarget) {
          // quick status
        }
        if (G.input.p('C') && this.infoTarget) { yield G.statusScreen(this.infoTarget); }
        if (G.input.p('B')) { G.audio.sfx('cancel'); break; }
      }
      this.cursor = null; this.infoTarget = null; this.overlay = saveO; this.overlayColor = saveC;
      if (this.active) this.centerOn(this.active.x, this.active.y);
    }

    // ---------- enemy AI ----------
    threatSet(u) {
      const r = this.reach(u); const rg = R().range(u); const s = new Set();
      for (const k of r.stop) { const [ax, ay] = k.split(',').map(Number); this.tilesInRange(ax, ay, rg).forEach(([tx, ty]) => s.add(key(tx, ty))); }
      return s;
    }
    expected(att, tgt, tile) {
      let d = Math.max(1, R().stat(att, 'att') - R().stat(tgt, 'def'));
      const le = R().landEffect(tgt, tile); if (le === 15) d = d * 230 / 256; else if (le >= 30) d = d * 205 / 256;
      return d;
    }
    *enemyTurn(u) {
      this.active = u;
      if (u.enemy && !u.awake) {
        // wake if any ally is inside this unit's threat area, or if it was damaged
        const th = this.threatSet(u);
        if (u.hp < u.mhp || this.alive('ally').some(a => th.has(key(a.x, a.y)))) u.awake = true;
        else return;
      }
      yield* this.focus(u.x, u.y);
      yield 10;
      const plan = this.planEnemy(u);
      if (plan.path && plan.path.length > 1) { yield* this.walk(u, plan.path, 4); yield 6; }
      if (plan.kind === 'attack') {
        const t = plan.targets[0];
        u.dir = Math.abs(t.x - u.x) > Math.abs(t.y - u.y) ? (t.x > u.x ? 'right' : 'left') : (t.y > u.y ? 'down' : 'up');
        this.cursor = { x: t.x, y: t.y }; yield 16; this.cursor = null;
        yield* this.runAction({ actor: u, targets: plan.targets, kind: 'attack' });
      } else if (plan.kind === 'spell') {
        this.area = new Set(plan.targets.map(t => key(t.x, t.y))); this.cursor = { x: plan.targets[0].x, y: plan.targets[0].y }; yield 20; this.area = null; this.cursor = null;
        yield* this.runAction({ actor: u, targets: plan.targets, kind: 'spell', spell: plan.spell, lvl: plan.lvl });
      } else yield 8;
      u.dir = 'down';
    }
    planEnemy(u) {
      const FOE = u.side === 'ally' ? 'enemy' : 'ally', OWN = u.side;
      const allies = this.alive(FOE);
      const r = u.ai === 'guard' ? { stop: new Set([key(u.x, u.y)]), prev: new Map(), cost: new Map([[key(u.x, u.y), 0]]) } : this.reach(u);
      let best = null;
      const consider = (score, plan) => { if (!best || score > best.score) best = Object.assign({ score }, plan); };
      const tiles = [...r.stop].map(k => k.split(',').map(Number));
      const rg = R().range(u);
      const spells = R().spellLevelsKnown(u);
      for (const [tx, ty] of tiles) {
        const le = R().landEffect(u, this.map.get(tx, ty));
        const moveCost = (r.cost.get(key(tx, ty)) || 0);
        // physical attacks
        for (const t of this.targetsInRange(u, rg, FOE, tx, ty)) {
          const e = this.expected(u, t, this.map.get(t.x, t.y));
          let s = e * 3 + (e >= t.hp ? 60 : 0) + (1 - t.hp / t.mhp) * 12 + le / 10 - moveCost * 0.01;
          if (t.id === 'rowan') s += 6; if (t.boss) s += 4;
          if (R().cls(t) && R().cls(t).healer) s += 4;
          consider(s, { kind: 'attack', tile: [tx, ty], targets: [t] });
        }
        // spells
        for (const sp of spells) {
          const S = D().spells[sp.id];
          for (let lv = sp.lv; lv >= 1; lv--) {
            const L = S.levels[lv - 1]; if (u.mp < L.mp) continue;
            if (S.kind === 'heal') {
              for (const [cx, cy] of this.tilesInRange(tx, ty, L.range)) {
                const o = this.unitAt(cx, cy) || ((cx === tx && cy === ty) ? u : null);
                if (!o || o.side !== OWN || o.hp >= o.mhp * 0.7) continue;
                const s = (o.mhp - o.hp) * 3 + (o.boss ? 20 : 0) + 30;
                consider(s, { kind: 'spell', spell: sp.id, lvl: lv, tile: [tx, ty], targets: [o] });
              }
            } else if (S.kind === 'damage' || S.kind === 'poison') {
              for (const [cx, cy] of this.tilesInRange(tx, ty, L.range)) {
                const hit = this.areaTiles(cx, cy, L.area).map(([x, y]) => this.unitAt(x, y)).filter(o => o && o.side === FOE);
                if (!hit.length) continue;
                let s = 0;
                hit.forEach(o => { const p = S.kind === 'damage' ? L.power : 4; s += p * 3 + (p >= o.hp ? 60 : 0); });
                s -= L.mp * 0.5; if (S.kind === 'poison' && hit.every(o => o.status.poison)) s = -1;
                consider(s + 2, { kind: 'spell', spell: sp.id, lvl: lv, tile: [tx, ty], targets: hit });
              }
            }
          }
        }
      }
      if (best) { best.path = this.pathTo(r, best.tile[0], best.tile[1]); return best; }
      // approach: distance field from allies (terrain-aware, ignoring units)
      if (u.ai === 'guard') return { kind: 'none' };
      const field = new Map(); const open = [];
      allies.forEach(a => { this.tilesInRange(a.x, a.y, rg).forEach(([x, y]) => { if (isFinite(R().moveCost(u, this.map.get(x, y)))) { field.set(key(x, y), 0); open.push([0, x, y]); } }); });
      while (open.length) {
        open.sort((a, b) => a[0] - b[0]); const [c, x, y] = open.shift();
        if (c > field.get(key(x, y))) continue;
        for (const [dx, dy] of DIR4) {
          const nx = x + dx, ny = y + dy; if (nx < 0 || ny < 0 || nx >= this.map.w || ny >= this.map.h) continue;
          const mc = R().moveCost(u, this.map.get(nx, ny)); if (!isFinite(mc)) continue;
          const nc = c + mc; const k = key(nx, ny);

        }
      }
      let bt = null, bv = Infinity;
      for (const [tx, ty] of tiles) { const v = field.has(key(tx, ty)) ? field.get(key(tx, ty)) : Infinity; const le = R().landEffect(u, this.map.get(tx, ty)); const sc = v - le / 100; if (sc < bv) { bv = sc; bt = [tx, ty]; } }
      if (!bt) return { kind: 'none' };
      return { kind: 'none', path: this.pathTo(r, bt[0], bt[1]) };
    }

    // ---------- end of battle ----------
    *finish() {
      this.active = null; this.overlay = null;
      const res = this.result;
      if (res === 'win') {
        G.audio.jingle('victory');
        yield 30;
        if (this.def.outro) yield* this.def.outro(this);
      } else if (res === 'lose') {
        G.audio.play('sad');
        yield G.say(G.st.leader().name + ' has fallen... The force retreats.', { auto: 0 });
      } else if (res === 'recall') {
        yield 20;
      }
      yield G.fadeTo(1, 0.03);
      // cleanup
      this.units.forEach(u => { if (!u.enemy) { delete u.x; delete u.y; delete u.ox; delete u.oy; delete u.side; delete u.gone; u.status = {}; } });
      G.onBattleEnd(this.id, res);
    }

    // ---------- scene hooks ----------
    update() {
      this.t++;
      this.tasks.update();
      if (this.flashUnit && --this.flashUnit.t <= 0) this.flashUnit = null;
      this.cam.x += (this.camT.x - this.cam.x) * 0.25; this.cam.y += (this.camT.y - this.cam.y) * 0.25;
      if (Math.abs(this.camT.x - this.cam.x) < 0.5) this.cam.x = this.camT.x; if (Math.abs(this.camT.y - this.cam.y) < 0.5) this.cam.y = this.camT.y;
    }
    draw(ctx) {
      const T = G.TILE; const cx = Math.round(this.cam.x), cy = Math.round(this.cam.y);
      ctx.fillStyle = '#000'; ctx.fillRect(0, 0, G.W, G.H);
      const x0 = Math.floor(cx / T), y0 = Math.floor(cy / T);
      for (let y = y0; y <= y0 + Math.ceil(G.H / T) + 1; y++) for (let x = x0; x <= x0 + Math.ceil(G.W / T) + 1; x++) {
        if (x < 0 || y < 0 || x >= this.map.w || y >= this.map.h) continue;
        G.drawTile(ctx, this.map, x, y, x * T - cx, y * T - cy, this.t);
      }
      // overlays
      const pulse = 0.22 + 0.14 * Math.sin(this.t / 8);
      const colMap = { move: '#ffffff', attack: '#ff3030', heal: '#60ff90' };
      if (this.overlay) {
        ctx.fillStyle = colMap[this.overlayColor] || '#fff'; ctx.globalAlpha = pulse;
        for (const k of this.overlay) { const [x, y] = k.split(',').map(Number); ctx.fillRect(x * T - cx + 1, y * T - cy + 1, T - 2, T - 2); }
        ctx.globalAlpha = 1;
      }
      if (this.area) {
        ctx.fillStyle = '#ffe040'; ctx.globalAlpha = 0.35 + 0.15 * Math.sin(this.t / 5);
        for (const k of this.area) { const [x, y] = k.split(',').map(Number); ctx.fillRect(x * T - cx + 1, y * T - cy + 1, T - 2, T - 2); }
        ctx.globalAlpha = 1;
      }
      // units (y-sorted)
      const us = this.units.filter(u => !u.gone && u.hp > 0 && !u.hidden).sort((a, b) => (a.y * T + a.oy) - (b.y * T + b.oy));
      for (const u of us) {
        const spec = u.enemy ? u.kind.map : D().chars[u.id].map;
        const isAct = u === this.active;
        const fr = Math.floor((this.t + (u.x * 7 + u.y * 3)) / (isAct ? 8 : 16)) % 2;
        const img = G.unitSprite(spec, u.dir || 'down', fr);
        const px = u.x * T + u.ox - cx, py = u.y * T + u.oy - cy - 3;
        if (px < -T || py < -T || px > G.W || py > G.H) continue;
        ctx.drawImage(img, Math.round(px), Math.round(py));
        if (this.flashUnit && this.flashUnit.u === u && this.flashUnit.t % 4 < 2) ctx.drawImage(G.tinted(img, '#80ff80', JSON.stringify(spec) + u.dir + fr), Math.round(px), Math.round(py));
        if (u.status.poison) { ctx.fillStyle = '#60e060'; ctx.fillRect(px + 19, py + 2, 3, 3); }
        if (u.status.quick) { ctx.fillStyle = '#80c0ff'; ctx.fillRect(px + 1, py + 2, 3, 3); }

      }
      // active marker

    exitAt(x, y) { return (this.def.exits || []).find(e => e.x === x && e.y === y && (!e.cond || e.cond())); }

    camTarget() {

    *npcAI() {

  b3: { rows: ["TTTTTTTTTTTTTTTTTTTTTTTT", "TffffffffffffffffffffffT", "TffffffffffffffTTTTffffT", "TffTTTfffffffffTTTTffffT", "TffTTTfffff,,,,,,,,,,,fT", "TffTTTfffff,fffffffffffT", "Tffffffffff,ffffff....fT", "Tf....fffff,.....f..g.fT", "Tf....fffff,..r..f.g..fT", "Tf....ffTTT,.....f...gfT", "Tf....ffTTT,.....ffffffT", "Tffffffffff,fffffffffffT", "Tffffffffff,fffffTTTfffT", "Tffffffffff,f~~~fTTTfffT", "TffffTTTTff,f~w~fTTTfffT", "TffffTTTTff,f~~~fTTTfffT", "T.....TTTff,fffffffffffT", "T.....,,,,,,fffffffffffT", "T.....fffffffffffffffffT", "TTTTTTTTTTTTTTTTTTTTTTTT"], pos: {} },
